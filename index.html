<style>
:root {
  /* Layout : une colonne centrée (46rem) sous une bande vichy ; le créneau gagnant s'affiche sur une ardoise de bistrot */
  --paper: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #18202E;
  --muted: #5A6476;
  --line: #D9DFE8;
  --accent: #2A52BE;
  --accent-ink: #FFFFFF;
  --accent-soft: #E4EAFA;
  --ging: rgba(42, 82, 190, 0.30);
  --yes: #17824A;
  --yes-soft: #DCF1E4;
  --maybe: #9A6200;
  --maybe-soft: #FAEBCB;
  --danger: #B93228;
  --slate: #232A30;
  --chalk: #F1EFE7;
  --chalk-dim: #A9B1B7;
  --chalk-line: rgba(241, 239, 231, 0.18);
  --chalk-yes: #9FE3B9;
  --chalk-maybe: #F3CD7E;

}
@media (prefers-color-scheme: dark) {

    --accent: #87A4FF; --accent-ink: #0D1530; --accent-soft: #1E2944; --ging: rgba(135, 164, 255, 0.24);
    --yes: #55C98A; --yes-soft: #163726; --maybe: #E9B24D; --maybe-soft: #3A2C10; --danger: #F07A6E;
    --slate: #0A0E12; --chalk: #F1EFE7; --chalk-dim: #9AA3AA; --chalk-line: rgba(241, 239, 231, 0.15);
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F131A; --surface: #171D26; --ink: #E7EBF2; --muted: #9AA4B5; --line: #2A3342;
  --accent: #87A4FF; --accent-ink: #0D1530; --accent-soft: #1E2944; --ging: rgba(135, 164, 255, 0.24);
  --yes: #55C98A; --yes-soft: #163726; --maybe: #E9B24D; --maybe-soft: #3A2C10; --danger: #F07A6E;
  --slate: #0A0E12; --chalk: #F1EFE7; --chalk-dim: #9AA3AA; --chalk-line: rgba(241, 239, 231, 0.15);
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;

}

}

}
textarea { resize: vertical; font-size: 0.9rem; }
input:focus, textarea:focus { border-color: var(--accent); outline: 2px solid var(--accent-soft); outline-offset: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }

details > summary { cursor: pointer; font-weight: 600; color: var(--accent); min-height: 32px; display: list-item; }

/* Boutons */
.btn {

.btn:active { transform: translateY(1px); }

.btn.big { width: 100%; min-height: 54px; font-size: 1.06rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn.danger { background: transparent; color: var(--danger); border-color: currentColor; }
.btn.chalk { background: var(--chalk); border-color: var(--chalk); color: var(--slate); }
.btn.chalk-ghost { background: transparent; border-color: var(--chalk-line); color: var(--chalk); }
.linkbtn {
  background: none; border: 0; padding: 6px 0; font: inherit; font-weight: 600; color: var(--accent);

.linkbtn.danger { color: var(--danger); }

/* Mes sondages */
.mine { display: flex; flex-direction: column; gap: 10px; }
.mine ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mine a {

}

.mine .ms { color: var(--muted); font-size: 0.88rem; font-variant-numeric: tabular-nums; }

.link-row { display: flex; gap: 8px; }
.link-row input { flex: 1; font-size: 0.88rem; color: var(--muted); }

/* Sondage */
.poll-head { display: flex; flex-direction: column; gap: 10px; }
.back { font-weight: 600; text-decoration: none; font-size: 0.92rem; align-self: flex-start; min-height: 32px; }
.note { font-size: 1.05rem; }
.meta { color: var(--muted); font-variant-numeric: tabular-nums; }
.banner {
  border: 1.5px dashed var(--maybe); background: var(--maybe-soft); border-radius: 12px; padding: 12px 16px;
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
}
.banner p { font-weight: 600; }

.verdict {
  position: relative; overflow: hidden; background: var(--slate); color: var(--chalk);
  border: 1px solid var(--chalk-line); border-radius: 16px; padding: 26px 24px;
  display: flex; flex-direction: column; gap: 12px;
}
.verdict::before {
  content: ""; position: absolute; inset: 7px; border: 1px solid var(--chalk-line); border-radius: 11px; pointer-events: none;
}

.v-label { font-size: 0.74rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--chalk-dim); font-weight: 700; }
.v-title { font-family: var(--font-display); font-size: clamp(1.6rem, 6vw, 2.2rem); line-height: 1.15; text-wrap: balance; }
.v-sub, .v-more { color: var(--chalk-dim); }
.v-more { font-size: 0.9rem; }
.v-score { font-variant-numeric: tabular-nums; }
.v-score b { font-size: 1.15rem; }
.who { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.who li { font-size: 0.88rem; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--chalk-line); }
.who .y { color: var(--chalk-yes); }
.who .m { color: var(--chalk-maybe); }
.who .n { color: var(--chalk-dim); text-decoration: line-through; }
.v-actions { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px; }

.tie {
  font: inherit; font-size: 0.85rem; color: var(--chalk); background: transparent; border: 1px dashed var(--chalk-line);

.cta { display: flex; flex-direction: column; gap: 10px; }

.answer .ahead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.intro { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; font-weight: 500; }
.legend { font-size: 0.88rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.pill.s2 { background: var(--maybe-soft); color: var(--maybe); }
.bulk { display: flex; gap: 8px; flex-wrap: wrap; }
.adays { display: flex; flex-direction: column; }
.amonth { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; padding: 16px 0 6px; }
.amonth:first-child { padding-top: 0; }
.arow {
  display: grid; grid-template-columns: 7.2rem minmax(0, 1fr); gap: 10px; align-items: center;
  padding-block: 8px; border-top: 1px solid var(--line);
}
.adate { font-variant-numeric: tabular-nums; font-weight: 600; }
.adate .wd { color: var(--muted); font-weight: 500; }
.aslots { display: flex; flex-wrap: wrap; gap: 6px; }
.sbtn {
  font: inherit; font-weight: 600; font-size: 0.92rem; min-height: 44px; padding: 8px 14px 8px 10px;
  border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  transition: background-color .12s, border-color .12s, color .12s;
}
.sbtn .mk {
  width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line);
  display: inline-grid; place-items: center; font-size: 0.78rem; line-height: 1; font-weight: 800; flex: none;
}
.sbtn.s1 { background: var(--yes-soft); border-color: var(--yes); color: var(--yes); }
.sbtn.s1 .mk { background: var(--yes); border-color: var(--yes); color: var(--surface); }
.sbtn.s1 .mk::before { content: "✓"; }
.sbtn.s2 { background: var(--maybe-soft); border-color: var(--maybe); border-style: dashed; color: var(--maybe); }
.sbtn.s2 .mk { border-color: var(--maybe); }
.sbtn.s2 .mk::before { content: "~"; }
@media (max-width: 440px) { .arow { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
.afoot {
  position: sticky; bottom: 0; z-index: 2;
  margin: 0 calc(-1 * var(--pad)) calc(-1 * var(--pad));
  padding: 12px var(--pad) calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line); border-radius: 0 0 16px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
}

.confirm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.share.flash { border-color: var(--yes); box-shadow: 0 0 0 3px var(--yes-soft); }
.okmsg { color: var(--yes); font-weight: 700; }
.share-actions { display: flex; flex-wrap: wrap; gap: 10px; }

.results { display: flex; flex-direction: column; gap: 12px; }
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.grid { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.grid th, .grid td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.grid thead th { font-size: 0.8rem; color: var(--muted); font-weight: 700; background: var(--surface); }
.grid tbody tr:last-child > * { border-bottom: 0; }
.grid .c-slot { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; border-right: 1px solid var(--line); }
.c-slot .d { display: block; font-weight: 600; color: var(--ink); }
.c-slot .t { display: block; font-size: 0.78rem; color: var(--muted); font-weight: 500; }
.tag {
  display: inline-block; margin-left: 6px; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--accent-ink); background: var(--accent); border-radius: 4px; padding: 1px 5px; vertical-align: 1px;
}
.c-score { min-width: 76px; }
.num { font-weight: 800; }
.of { color: var(--muted); }
.bar { display: block; height: 4px; background: var(--line); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--yes); }
.grid td.v1 { color: var(--yes); background: var(--yes-soft); font-weight: 800; }
.grid td.v2 { color: var(--maybe); background: var(--maybe-soft); font-weight: 800; }

.grid tr.best .c-slot, .grid tr.best .c-score, .grid tr.final .c-slot, .grid tr.final .c-score { background: var(--accent-soft); }
.who-btn {
  font: inherit; font-weight: 700; color: var(--accent); background: none; border: 0; cursor: pointer;
  padding: 4px 2px; max-width: 7rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  text-decoration: underline dotted; text-underline-offset: 3px;
}

.merge { border-top: 1px solid var(--line); padding-top: 14px; }
.merge-body { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
.merge-body .btn { align-self: flex-start; }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>

<script>
(function () {
  'use strict';

  // Adresse publique de cette page, utilisée pour fabriquer le lien à partager :
  // l'adresse du site quand la page est ouverte directement, sinon celle de la page Claude.
  const SHARE_BASE = window.top === window
    ? location.origin + location.pathname
    : 'https://claude.ai/artifact/Tfhs3q2YydBkQZWB5zrUQY';
  const STORE_KEY = 'on-mange-quand:v1';
  const EPOCH = 1767225600; // 1er janvier 2026, en secondes
  const DAY_MS = 86400000;
  const MAX_DAYS = 92, MAX_SLOTS = 200, MAX_PEOPLE = 40;

  // L'ordre compte : il fixe l'ordre des créneaux dans une journée et les bits du lien.
  const MOMENTS = ['Journée', 'Matin', 'Midi', 'Après-midi', 'Soir'];
  const SOIR = 1 << 4;
  const WD = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
  const WD_LONG = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
  const STATE_LABEL = ['pas dispo', 'dispo', 'si besoin'];

  const app = document.getElementById('app');
  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const $ = (sel) => app.querySelector(sel);

  /* ---------- Outils ---------- */
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = (s) => String(s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
  const nowU = () => Math.floor(Date.now() / 1000) - EPOCH;
  const plural = (n, one, many) => n + ' ' + (n > 1 ? (many || one + 's') : one);
  const popcount = (r) => (r & 1) + ((r >> 1) & 1) + ((r >> 2) & 1) + ((r >> 3) & 1) + ((r >> 4) & 1);

  const todayDay = (() => { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / DAY_MS; })();
  function parseYmd(s) {
    const c = String(s || '').replace(/-/g, '');
    if (!/^\d{8}$/.test(c)) return NaN;
    return Date.UTC(+c.slice(0, 4), +c.slice(4, 6) - 1, +c.slice(6, 8)) / DAY_MS;
  }
  function ymd(d, sep) {
    const t = new Date(d * DAY_MS);
    return [t.getUTCFullYear(), String(t.getUTCMonth() + 1).padStart(2, '0'), String(t.getUTCDate()).padStart(2, '0')].join(sep == null ? '-' : sep);
  }
  const weekday = (d) => (new Date(d * DAY_MS).getUTCDay() + 6) % 7;
  const dateOf = (d) => new Date(d * DAY_MS).getUTCDate();
  const monthKey = (d) => { const t = new Date(d * DAY_MS); return t.getUTCFullYear() * 12 + t.getUTCMonth(); };
  const F = (o) => new Intl.DateTimeFormat('fr-FR', Object.assign({ timeZone: 'UTC' }, o));
  const fShort = F({ weekday: 'short', day: 'numeric', month: 'short' });
  const fLong = F({ weekday: 'long', day: 'numeric', month: 'long' });
  const fMonth = F({ month: 'long', year: 'numeric' });
  const fDM = F({ day: 'numeric', month: 'short' });
  const fWd = F({ weekday: 'short' });
  const fmt = (f, d) => f.format(new Date(d * DAY_MS));
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  /* ---------- Encodage du lien ---------- */
  const B32 = 'abcdefghijklmnopqrstuvwxyz234567';
  function b32enc(bytes) {
    let out = '', bits = 0, val = 0;
    for (const b of bytes) {
      val = (val << 8) | b; bits += 8;
      while (bits >= 5) { out += B32[(val >>> (bits - 5)) & 31]; bits -= 5; }
      val &= (1 << bits) - 1;
    }
    if (bits > 0) out += B32[(val << (5 - bits)) & 31];
    return out;
  }
  function b32dec(str) {
    const out = []; let bits = 0, val = 0;
    for (const ch of str) {
      const i = B32.indexOf(ch);
      if (i < 0) throw new Error('format');
      val = (val << 5) | i; bits += 5;
      if (bits >= 8) { out.push((val >>> (bits - 8)) & 255); bits -= 8; }
      val &= (1 << bits) - 1;
    }
    return new Uint8Array(out);
  }
  const canZip = typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
  async function pipe(bytes, stream) {
    const s = new Blob([bytes]).stream().pipeThrough(stream);
    return new Uint8Array(await new Response(s).arrayBuffer());
  }
  async function encodeState(st) {
    const raw = new TextEncoder().encode(JSON.stringify(st));
    if (canZip) {
      try {
        const z = await pipe(raw, new CompressionStream('deflate-raw'));
        if (z.length < raw.length) return 'z1-' + b32enc(z);
      } catch (e) { /* on garde la version non compressée */ }
    }
    return 'j1-' + b32enc(raw);
  }
  async function decodeCode(code) {
    const m = /^([zj])1-([a-z2-7]+)$/.exec(code);
    if (!m) throw new Error('format');
    let bytes = b32dec(m[2]);
    if (m[1] === 'z') {
      if (!canZip) throw new Error('nozip');
      bytes = await pipe(bytes, new DecompressionStream('deflate-raw'));
    }
    return validate(JSON.parse(new TextDecoder().decode(bytes)));
  }
  function extractCode(text) {
    let t = String(text || '').trim();
    const h = t.lastIndexOf('#');
    if (h >= 0) t = t.slice(h + 1);
    const m = /([zj]1-[a-z2-7]{8,})/i.exec(t);
    return m ? m[1].toLowerCase() : null;
  }
  function validate(st) {
    if (!st || st.v !== 1 || typeof st.i !== 'string') throw new Error('format');
    const s = parseYmd(st.s), e = parseYmd(st.e);
    if (!(e >= s) || e - s >= MAX_DAYS) throw new Error('format');
    if (!Array.isArray(st.m) || st.m.length !== 7) throw new Error('format');
    const people = Array.isArray(st.p) ? st.p : [];
    return {
      v: 1,
      i: st.i.slice(0, 16),
      t: String(st.t || '').slice(0, 80),
      n: String(st.n || '').slice(0, 160),
      s: ymd(s, ''), e: ymd(e, ''),
      m: st.m.map((x) => (x | 0) & 31),
      x: Array.isArray(st.x) ? st.x.filter((o) => Number.isInteger(o) && o >= 0 && o < MAX_DAYS) : [],
      p: people
        .filter((p) => Array.isArray(p) && typeof p[0] === 'string' && p[0].trim())
        .slice(0, 200)
        .map((p) => [
          p[0].replace(/[\u0000-\u001f]/g, '').slice(0, 40),
          typeof p[1] === 'string' ? p[1].replace(/[^012]/g, '0').slice(0, MAX_SLOTS) : 0,
          Number(p[2]) || 0,
        ]),
      f: Array.isArray(st.f) ? [st.f[0] | 0, Number(st.f[1]) || 0] : null,
    };
  }
  // Réunit deux versions du même sondage : pour chaque prénom, la réponse la plus récente gagne.
  function merge(a, b) {
    const out = Object.assign({}, a);
    const map = new Map();
    for (const p of a.p.concat(b.p)) {
      const k = norm(p[0]);
      const cur = map.get(k);
      if (!cur || p[2] > cur[2]) map.set(k, p);
    }
    out.p = Array.from(map.values());
    out.f = !a.f ? b.f : !b.f ? a.f : (b.f[1] > a.f[1] ? b.f : a.f);
    return out;
  }

  /* ---------- Créneaux ---------- */
  function buildSlots(st) {
    const s = parseYmd(st.s), e = parseYmd(st.e);
    const ex = new Set(st.x.map((o) => s + o));
    const slots = [];
    for (let d = s; d <= e; d++) {
      if (ex.has(d)) continue;
      const r = st.m[weekday(d)];
      for (let t = 0; t < MOMENTS.length; t++) if (r & (1 << t)) slots.push({ d, t });
    }
    return slots;
  }
  const activePeople = (st) => st.p.filter((p) => typeof p[1] === 'string');
  function computeStats(slots, people) {
    return slots.map((sl, i) => {
      let y = 0, mb = 0;
      for (const p of people) { const c = p[1][i]; if (c === '1') y++; else if (c === '2') mb++; }
      return { i, y, mb, tot: y + mb };
    });
  }
  const rank = (stats) => stats.slice().sort((a, b) => b.tot - a.tot || b.y - a.y || a.i - b.i);
  const slotLong = (sl) => cap(fmt(fLong, sl.d)) + ' · ' + MOMENTS[sl.t];
  const slotShort = (sl) => fmt(fShort, sl.d) + ' · ' + MOMENTS[sl.t].toLowerCase();
  function momentsUsed(m) {
    const u = m.reduce((a, r) => a | r, 0);
    return MOMENTS.filter((_, t) => u & (1 << t));
  }
  function daysLabel(m) {
    const key = m.map((r) => (r ? 1 : 0)).join('');
    if (key === '1111111') return '';
    if (key === '1111100') return 'en semaine';
    if (key === '0000011') return 'le week-end';
    return WD.filter((_, w) => m[w]).map((s) => s.toLowerCase()).join(', ');
  }

  /* ---------- Mémoire locale (ce navigateur seulement) ---------- */
  function loadStore() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (s && typeof s === 'object' && s.polls && typeof s.polls === 'object') return s;
    } catch (e) { /* stockage indisponible */ }
    return { polls: {} };
  }
  function saveStore(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* ignoré */ } }
  function remember(st, code, me) {
    const s = loadStore();
    const prev = s.polls[st.i] || {};
    s.polls[st.i] = { st, code, seen: Date.now(), me: me !== undefined ? me : (prev.me || null) };
    Object.keys(s.polls).sort((a, b) => s.polls[b].seen - s.polls[a].seen).slice(20).forEach((id) => delete s.polls[id]);
    saveStore(s);
  }
  function getMe() {
    if (!poll || poll.example) return null;
    const p = loadStore().polls[poll.st.i];
    return (p && p.me) || null;
  }

  /* ---------- État ---------- */
  let view = null;     // 'create' | 'poll' | 'loading'
  let lastHash = null;
  let poll = null;     // { st, code, example, slots }
  let ui = freshUi();
  function freshUi() { return { open: false, name: '', vals: [], editing: null, delAsk: false, flash: '', intro: false, mergeMsg: '' }; }

  const draft = {
    t: '', n: '',
    s: todayDay + 1, e: todayDay + 28,
    m: [SOIR, SOIR, SOIR, SOIR, SOIR, SOIR, SOIR],
    x: new Set(),
  };

  /* ---------- Vue : création ---------- */
  function showCreate(msg) {
    view = 'create';
    poll = null;
    const store = loadStore();
    const mine = Object.values(store.polls).filter((p) => p && p.st && p.code).sort((a, b) => b.seen - a.seen).slice(0, 8);
    app.innerHTML = `
      <header class="hero">
        <p class="eyebrow">Sondage de dispos · sans compte</p>
        <h1>On mange quand&nbsp;?</h1>
        <p class="lede">Choisissez la période et les moments possibles, envoyez le lien au groupe&nbsp;: chacun coche ses dispos et le meilleur créneau ressort tout seul.</p>
        <p class="hero-links"><a class="btn" href="#exemple">Voir un exemple</a></p>
      </header>
      ${msg ? `<p class="error" role="alert">${esc(msg)}</p>` : ''}
      ${mine.length ? `<section class="mine"><h2>Vos sondages</h2><ul>${mine.map((p) => {
        const people = activePeople(p.st).length;
        return `<li><a href="#${esc(p.code)}"><span class="mt">${esc(p.st.t || 'Repas')}</span><span class="ms">${fmt(fDM, parseYmd(p.st.s))} → ${fmt(fDM, parseYmd(p.st.e))} · ${plural(people, 'réponse')}</span></a></li>`;
      }).join('')}</ul></section>` : ''}
      <section class="card" aria-labelledby="c-h">
        <h2 id="c-h">Nouveau sondage</h2>
        <div class="field"><label for="c-title">Nom du repas</label><input type="text" id="c-title" maxlength="80" placeholder="Raclette de janvier" autocomplete="off"></div>
        <div class="field"><label for="c-note">Précisions <span class="opt">(facultatif)</span></label><input type="text" id="c-note" maxlength="160" placeholder="Chez Julie, chacun apporte un plat" autocomplete="off"></div>
        <fieldset class="field"><legend>Période</legend>
          <div class="dates">
            <label for="c-start">Du<input type="date" id="c-start"></label>
            <label for="c-end">Au<input type="date" id="c-end"></label>
          </div>
        </fieldset>
        <fieldset class="field"><legend>Moments possibles</legend><div class="chips" id="c-moments"></div></fieldset>
        <fieldset class="field"><legend>Jours possibles</legend>
          <div class="chips days" id="c-days"></div>
          <div class="presets">Raccourcis&nbsp;:
            <button type="button" class="mini" data-act="preset" data-p="all">Tous les jours</button>
            <button type="button" class="mini" data-act="preset" data-p="week">En semaine</button>
            <button type="button" class="mini" data-act="preset" data-p="weekend">Week-end</button>
          </div>
        </fieldset>
        <details id="c-fine">
          <summary>Ajuster jour par jour</summary>
          <div class="fine-body">
            <p class="hint">Par exemple&nbsp;: le soir en semaine, midi et soir le week-end.</p>
            <div class="matrix-scroll"><table class="matrix" id="c-matrix"></table></div>
          </div>
        </details>
        <div class="field">
          <div class="preview-head"><span class="label">Aperçu</span><span class="count" id="c-count"></span></div>
          <p class="hint">Touchez un jour pour l’exclure (anniversaire, week-end déjà pris…).</p>
          <div class="cal" id="c-cal"></div>
        </div>
        <p class="error" id="c-error" role="alert" hidden></p>
        <button type="button" class="btn primary big" id="c-create" data-act="create">Créer le sondage</button>
      </section>
      <section class="card" aria-labelledby="p-h">
        <h2 id="p-h">Vous avez reçu un lien&nbsp;?</h2>
        <p class="muted">Il ouvre normalement le sondage tout seul. Sinon, collez-le ici.</p>
        <div class="link-row"><input type="text" id="p-in" placeholder="Collez le lien du sondage" autocomplete="off"><button type="button" class="btn" data-act="paste-open">Ouvrir</button></div>
        <p class="error" id="p-msg" role="alert" hidden></p>
      </section>`;
    $('#c-title').value = draft.t;
    $('#c-note').value = draft.n;
    $('#c-start').value = Number.isFinite(draft.s) ? ymd(draft.s) : '';
    $('#c-start').min = ymd(todayDay);
    $('#c-end').value = Number.isFinite(draft.e) ? ymd(draft.e) : '';
    renderCreateDynamic();
  }

  function draftCheck() {
    const { s, e } = draft;
    if (!Number.isFinite(s) || !Number.isFinite(e)) return { err: 'Choisissez une date de début et une date de fin.' };
    if (e < s) return { err: 'La date de fin doit être après la date de début.' };
    if (e - s >= MAX_DAYS) return { err: 'Période trop longue : 3 mois maximum.' };
    let slots = 0, days = 0;
    for (let d = s; d <= e; d++) {
      const r = draft.m[weekday(d)];
      if (!r || draft.x.has(d)) continue;
      days++; slots += popcount(r);
    }
    if (!slots) return { err: 'Aucun créneau : choisissez au moins un jour et un moment.', slots, days };
    if (slots > MAX_SLOTS) return { err: `Trop de créneaux (${slots}). Réduisez la période ou le nombre de moments (${MAX_SLOTS} maximum).`, slots, days };
    return { slots, days };
  }

  function renderCreateDynamic() {
    const union = draft.m.reduce((a, r) => a | r, 0);
    $('#c-moments').innerHTML = MOMENTS.map((label, t) =>
      `<button type="button" class="chip" data-act="moment" data-t="${t}" aria-pressed="${!!(union & (1 << t))}">${label}</button>`).join('');
    $('#c-days').innerHTML = WD.map((d, w) =>
      `<button type="button" class="chip" data-act="day" data-w="${w}" aria-pressed="${draft.m[w] !== 0}" aria-label="${WD_LONG[w]}">${d}</button>`).join('');
    $('#c-matrix').innerHTML =
      `<thead><tr><td></td>${WD.map((d) => `<th scope="col">${d}</th>`).join('')}</tr></thead><tbody>` +
      MOMENTS.map((label, t) => `<tr><th scope="row">${label}</th>${WD.map((d, w) =>
        `<td><button type="button" class="mcell" data-act="cell" data-w="${w}" data-t="${t}" aria-pressed="${!!(draft.m[w] & (1 << t))}" aria-label="${label}, ${WD_LONG[w]}"></button></td>`).join('')}</tr>`).join('') +
      '</tbody>';

    const chk = draftCheck();
    const cal = $('#c-cal');
    const { s, e } = draft;
    if (Number.isFinite(s) && Number.isFinite(e) && e >= s && e - s < MAX_DAYS) {
      let html = ['lu', 'ma', 'me', 'je', 've', 'sa', 'di'].map((d) => `<span class="wh">${d}</span>`).join('');
      const gStart = s - weekday(s), gEnd = e + (6 - weekday(e));
      for (let w0 = gStart; w0 <= gEnd; w0 += 7) {
        let label = null;
        if (w0 === gStart) label = s;
        else for (let k = w0; k <= Math.min(w0 + 6, e); k++) if (dateOf(k) === 1) label = k;
        if (label !== null) html += `<span class="mh">${fmt(fMonth, label)}</span>`;
        for (let k = w0; k < w0 + 7; k++) {
          if (k < s || k > e) { html += '<span class="cd" aria-hidden="true"></span>'; continue; }
          const r = draft.m[weekday(k)];
          if (!r) { html += `<span class="cd off" aria-hidden="true">${dateOf(k)}</span>`; continue; }
          const ex = draft.x.has(k);
          html += `<button type="button" class="cd ${ex ? 'ex' : 'on'}" data-act="excl" data-d="${k}" aria-pressed="${!ex}" aria-label="${fmt(fLong, k)}${ex ? ', exclu' : ''}">${dateOf(k)}${ex ? '' : `<span class="dots">${'<i></i>'.repeat(popcount(r))}</span>`}</button>`;
        }
      }
      cal.innerHTML = html;
    } else {
      cal.innerHTML = '';
    }
    $('#c-count').textContent = chk.slots ? `${plural(chk.slots, 'créneau', 'créneaux')} sur ${plural(chk.days, 'jour')}` : '';
    const err = $('#c-error');
    err.hidden = !chk.err;
    err.textContent = chk.err || '';
    $('#c-create').disabled = !!chk.err;
  }

  function toggleMoment(t) {
    const bit = 1 << t;
    const on = draft.m.some((r) => r & bit);
    if (on) { draft.m = draft.m.map((r) => r & ~bit); return; }
    const anyDay = draft.m.some((r) => r);
    draft.m = draft.m.map((r) => (anyDay ? (r ? r | bit : r) : bit));
  }
  function toggleDay(w) {
    if (draft.m[w]) { draft.m[w] = 0; return; }
    draft.m[w] = draft.m.reduce((a, r) => a | r, 0) || SOIR;
  }
  function preset(p) {
    const u = draft.m.reduce((a, r) => a | r, 0) || SOIR;
    draft.m = draft.m.map((_, w) => (p === 'all' || (p === 'week' && w < 5) || (p === 'weekend' && w >= 5)) ? u : 0);
  }

  async function createPoll() {
    const chk = draftCheck();
    if (chk.err) return;
    const id = (() => { const b = new Uint8Array(5); crypto.getRandomValues(b); return b32enc(b); })();
    const st = {
      v: 1, i: id,
      t: draft.t.trim() || 'Repas entre amis',
      n: draft.n.trim(),
      s: ymd(draft.s, ''), e: ymd(draft.e, ''),
      m: draft.m.slice(),
      x: Array.from(draft.x).filter((d) => d >= draft.s && d <= draft.e).map((d) => d - draft.s).sort((a, b) => a - b),
      p: [], f: null,
    };
    poll = { st, code: '', example: false };
    ui = freshUi();
    openAnswer(null);
    ui.intro = true;
    view = 'poll';
    await commit();
    window.scrollTo(0, 0);
  }

  /* ---------- Vue : sondage ---------- */
  function openAnswer(name) {
    const slots = buildSlots(poll.st);
    const keep = ui.flash;
    ui = freshUi();
    ui.flash = keep === 'saved' ? '' : keep;
    ui.open = true;
    const p = name ? activePeople(poll.st).find((x) => norm(x[0]) === norm(name)) : null;
    if (p) {
      ui.editing = p[0]; ui.name = p[0];
      ui.vals = slots.map((_, i) => +(p[1][i] || 0));
    } else {
      ui.name = name || '';
      ui.vals = slots.map(() => 0);
    }
  }

  function renderPoll() {
    const st = poll.st;
    const slots = buildSlots(st);
    poll.slots = slots;
    const people = activePeople(st);
    const stats = computeStats(slots, people);
    const s = parseYmd(st.s), e = parseYmd(st.e);
    const dl = daysLabel(st.m);
    const meta = [
      `Du ${fmt(fShort, s)} au ${fmt(fShort, e)}`,
      momentsUsed(st.m).join(', ') + (dl ? ' · ' + dl : ''),
      plural(people.length, 'réponse'),
    ].join(' · ');
    app.innerHTML = `
      <header class="poll-head">
        <a class="back" href="#nouveau">← Nouveau sondage</a>
        <h1>${esc(st.t || 'Repas')}</h1>
        ${st.n ? `<p class="note">${esc(st.n)}</p>` : ''}
        <p class="meta">${esc(meta)}</p>
      </header>
      ${poll.example ? `<div class="banner"><p>Exemple avec des réponses fictives. Rien n’est enregistré.</p><a class="btn" href="#nouveau">Créer mon sondage</a></div>` : ''}
      ${verdictHTML(slots, people, stats)}
      ${answerHTML(slots, people)}
      ${poll.example ? '' : shareHTML()}
      ${tableHTML(slots, people, stats)}
      ${poll.example ? '' : mergeHTML()}`;
  }

  function finalIndex(slots) {
    const f = poll.st.f;
    return f && f[0] >= 0 && f[0] < slots.length ? f[0] : -1;
  }

  function whoList(i, people) {
    const y = [], m = [], n = [];
    for (const p of people) { const c = p[1][i]; (c === '1' ? y : c === '2' ? m : n).push(p[0]); }
    return `<ul class="who">${y.map((x) => `<li class="y">✓ ${esc(x)}</li>`).join('')}${m.map((x) => `<li class="m">~ ${esc(x)}</li>`).join('')}${n.map((x) => `<li class="n">${esc(x)}</li>`).join('')}</ul>`;
  }
  function scoreLine(r, n) {
    return `<p class="v-score"><b>${r.tot}</b> sur ${n} ${n > 1 ? 'personnes' : 'personne'} ${r.tot > 1 ? 'disponibles' : 'disponible'}${r.mb ? ` (dont ${r.mb} si besoin)` : ''}</p>`;
  }
  function verdictHTML(slots, people, stats) {
    const n = people.length;
    const wrap = (label, title, body) => `<section class="verdict" aria-live="polite"><p class="v-label">${label}</p><p class="v-title">${title}</p>${body}</section>`;
    if (!n) return wrap('Meilleur créneau', 'Pas encore de réponse', `<p class="v-sub">${plural(slots.length, 'créneau proposé', 'créneaux proposés')}. Le meilleur s’affichera ici dès les premières réponses.</p>`);
    const f = finalIndex(slots);
    if (f >= 0) {
      return wrap('C’est décidé', esc(slotLong(slots[f])),
        scoreLine(stats[f], n) + whoList(f, people) +
        `<div class="v-actions"><button type="button" class="btn chalk-ghost" data-act="unfinal">Changer de créneau</button></div>`);
    }
    const ranked = rank(stats);
    const best = ranked[0];
    if (best.tot === 0) return wrap('Meilleur créneau', 'Aucun créneau commun pour l’instant', `<p class="v-sub">Personne n’a encore coché de dispo.</p>`);
    const ties = ranked.filter((r) => r.tot === best.tot && r.y === best.y);
    const more = ranked.filter((r) => r.tot > 0 && !ties.includes(r)).slice(0, 3);
    const label = ties.length > 1 ? `Égalité entre ${ties.length} créneaux` : (best.tot === n && !best.mb ? 'Tout le monde est dispo' : 'Meilleur créneau');
    let body = scoreLine(best, n) + whoList(best.i, people);
    body += `<div class="v-actions"><button type="button" class="btn chalk" data-act="final" data-i="${best.i}">Choisir ce créneau</button></div>`;
    if (ties.length > 1) {
      body += `<div class="ties">Aussi à égalité&nbsp;: ${ties.slice(1, 6).map((r) =>
        `<button type="button" class="tie" data-act="final" data-i="${r.i}" title="Choisir ce créneau">${esc(slotShort(slots[r.i]))}</button>`).join('')}</div>`;
    }
    if (more.length) body += `<p class="v-more">Ensuite&nbsp;: ${more.map((r) => `${esc(slotShort(slots[r.i]))} (${r.tot}/${n})`).join(' · ')}</p>`;
    return wrap(label, esc(slotLong(slots[best.i])), body);
  }

  function answerCountText() {
    let y = 0, m = 0;
    for (const v of ui.vals) { if (v === 1) y++; else if (v === 2) m++; }
    return `${y} dispo · ${m} si besoin`;
  }
  function nameHint(name) {
    const k = norm(name);
    if (!k) return '';
    if (ui.editing && norm(ui.editing) === k) return `Vous modifiez la réponse de ${ui.editing}.`;
    const ex = activePeople(poll.st).find((p) => norm(p[0]) === k);
    if (ex) return `${ex[0]} a déjà répondu : cette réponse remplacera la sienne.`;
    if (ui.editing) return `La réponse de ${ui.editing} sera renommée « ${name.trim()} ».`;
    return '';
  }
  function slotAria(sl, v) { return `${fmt(fLong, sl.d)}, ${MOMENTS[sl.t].toLowerCase()} : ${STATE_LABEL[v]}`; }

  function answerHTML(slots, people) {
    if (!ui.open) {
      const me = getMe();
      const meP = me && people.find((p) => norm(p[0]) === norm(me));
      return `<section class="cta" id="answer">
        ${meP
          ? `<button type="button" class="btn primary big" data-act="edit" data-name="${esc(meP[0])}">Modifier mes dispos (${esc(meP[0])})</button>
             <button type="button" class="btn" data-act="open-answer">Ajouter une autre personne</button>`
          : `<button type="button" class="btn primary big" data-act="open-answer">Ajouter mes dispos</button>`}
        ${people.length ? '<p class="hint">Déjà répondu&nbsp;? Touchez votre prénom dans le tableau pour modifier.</p>' : ''}
      </section>`;
    }
    let rows = '', lastDay = null, lastMonth = null;
    slots.forEach((sl, i) => {
      if (sl.d !== lastDay) {
        if (lastDay !== null) rows += '</div></div>';
        if (monthKey(sl.d) !== lastMonth) { rows += `<p class="amonth">${fmt(fMonth, sl.d)}</p>`; lastMonth = monthKey(sl.d); }
        rows += `<div class="arow"><div class="adate"><span class="wd">${fmt(fWd, sl.d)}</span> ${fmt(fDM, sl.d)}</div><div class="aslots">`;
        lastDay = sl.d;
      }
      const v = ui.vals[i] || 0;
      rows += `<button type="button" class="sbtn s${v}" data-act="slot" data-i="${i}" aria-label="${esc(slotAria(sl, v))}"><span class="mk" aria-hidden="true"></span>${MOMENTS[sl.t]}</button>`;
    });
    if (lastDay !== null) rows += '</div></div>';
    const del = !ui.editing ? '' : ui.delAsk
      ? `<div class="confirm"><span>Supprimer la réponse de ${esc(ui.editing)}&nbsp;?</span><button type="button" class="btn danger" data-act="del-confirm">Supprimer</button><button type="button" class="btn" data-act="del-cancel">Annuler</button></div>`
      : `<button type="button" class="linkbtn danger" data-act="del-ask">Supprimer la réponse de ${esc(ui.editing)}</button>`;
    return `<section class="card answer" id="answer" aria-labelledby="a-h">
      <div class="ahead"><h2 id="a-h">${ui.editing ? 'Modifier une réponse' : 'Mes dispos'}</h2><button type="button" class="linkbtn" data-act="close-answer">Fermer</button></div>
      ${ui.intro ? '<p class="intro">Le sondage est prêt. Cochez d’abord vos dispos, puis envoyez le lien au groupe.</p>' : ''}
      <div class="field"><label for="ans-name">Prénom</label><input type="text" id="ans-name" maxlength="40" autocomplete="given-name" placeholder="Camille" value="${esc(ui.name)}"><p class="hint" id="ans-hint" aria-live="polite">${esc(nameHint(ui.name))}</p></div>
      <p class="legend">Touchez un créneau&nbsp;: une fois <span class="pill s1">✓ dispo</span> deux fois <span class="pill s2">~ si besoin</span> trois fois pour effacer.</p>
      <div class="bulk"><button type="button" class="mini" data-act="bulk" data-v="1">Tout cocher</button><button type="button" class="mini" data-act="bulk" data-v="0">Tout effacer</button></div>
      <div class="adays">${rows}</div>
      ${del}
      <div class="afoot"><span class="count" id="ans-count">${answerCountText()}</span><button type="button" class="btn primary" data-act="save">Enregistrer mes dispos</button></div>
    </section>`;
  }

  function shareLink() { return SHARE_BASE ? SHARE_BASE + '#' + poll.code : poll.code; }
  function shareHTML() {
    const link = shareLink();
    const wa = 'https://wa.me/?text=' + encodeURIComponent(`${poll.st.t || 'Repas'} : ajoute tes dispos ici ${link}`);
    const flash = ui.flash === 'saved'
      ? '<p class="okmsg">C’est enregistré dans le lien. Envoyez-le maintenant au groupe pour que tout le monde voie votre réponse.</p>'
      : ui.flash === 'final'
        ? '<p class="okmsg">Créneau choisi. Renvoyez le lien au groupe pour prévenir tout le monde.</p>'
        : '';
    return `<section class="card share ${flash ? 'flash' : ''}" id="share" aria-labelledby="s-h">
      <h2 id="s-h">Envoyer au groupe</h2>
      ${flash}
      <p class="muted">Le lien contient le sondage et toutes les réponses. Après avoir répondu, chacun renvoie le lien mis à jour&nbsp;: prenez toujours le dernier envoyé.</p>
      <div class="link-row"><input type="text" id="share-link" readonly value="${esc(link)}" aria-label="${SHARE_BASE ? 'Lien du sondage' : 'Code du sondage'}"><button type="button" class="btn primary" data-act="copy">Copier le lien</button></div>
      <div class="share-actions"><a class="btn" href="${esc(wa)}" target="_blank" rel="noopener">Envoyer sur WhatsApp</a></div>
    </section>`;
  }

  function tableHTML(slots, people, stats) {
    if (!people.length) return '';
    const n = people.length;
    const best = rank(stats)[0];
    const f = finalIndex(slots);
    const isBest = (r) => f < 0 && best.tot > 0 && r.tot === best.tot && r.y === best.y;
    const head = `<tr><th class="c-slot" scope="col">Créneau</th><th class="c-score" scope="col">Dispo</th>${people.map((p) =>
      `<th scope="col"><button type="button" class="who-btn" data-act="edit" data-name="${esc(p[0])}" title="Modifier la réponse de ${esc(p[0])}">${esc(p[0])}</button></th>`).join('')}</tr>`;
    const body = slots.map((sl, i) => {
      const r = stats[i];
      const cls = i === f ? 'final' : isBest(r) ? 'best' : '';
      const tag = i === f ? '<span class="tag">choisi</span>' : isBest(r) ? '<span class="tag">en tête</span>' : '';
      const pct = Math.round((r.tot / n) * 100);
      const cells = people.map((p) => {
        const c = p[1][i];
        return c === '1' ? '<td class="v1" title="Dispo">✓</td>' : c === '2' ? '<td class="v2" title="Si besoin">~</td>' : '<td class="v0" title="Pas dispo">·</td>';
      }).join('');
      return `<tr class="${cls}"><th class="c-slot" scope="row"><span class="d">${fmt(fShort, sl.d)}${tag}</span><span class="t">${MOMENTS[sl.t]}</span></th><td class="c-score"><span class="num">${r.tot}</span><span class="of">/${n}</span><span class="bar"><i style="width:${pct}%"></i></span></td>${cells}</tr>`;
    }).join('');
    return `<section class="results" aria-labelledby="r-h">
      <h2 id="r-h">Toutes les réponses</h2>
      <p class="hint">Touchez un prénom pour modifier sa réponse. <span class="pill s1">✓ dispo</span> <span class="pill s2">~ si besoin</span></p>
      <div class="table-scroll"><table class="grid"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    </section>`;
  }

  function mergeHTML() {
    return `<details class="merge" ${ui.mergeMsg ? 'open' : ''}>
      <summary>Plusieurs liens reçus en même temps&nbsp;?</summary>
      <div class="merge-body">
        <p class="muted">Si deux personnes ont répondu à partir du même lien, chacune a renvoyé une version différente. Collez ici l’autre lien pour réunir toutes les réponses. Ouvrir chaque lien dans ce navigateur les réunit aussi automatiquement.</p>
        <textarea id="merge-in" rows="3" placeholder="Collez un lien du même sondage"></textarea>
        <button type="button" class="btn" data-act="merge">Réunir les réponses</button>
        <p class="hint" id="merge-msg" aria-live="polite">${ui.mergeMsg}</p>
      </div>
    </details>`;
  }

  /* ---------- Actions ---------- */
  async function commit(me) {
    if (poll.example) { renderPoll(); return; }
    const code = await encodeState(poll.st);
    poll.code = code;
    remember(poll.st, code, me);
    if (location.hash.replace(/^#/, '') !== code) { lastHash = code; location.hash = code; }
    renderPoll();
  }

  async function openState(st) {
    const local = loadStore().polls[st.i];
    let merged = st;
    if (local && local.st) { try { merged = merge(validate(local.st), st); } catch (e) { /* copie locale illisible */ } }
    const same = poll && !poll.example && poll.st.i === st.i;
    poll = { st: merged, code: '', example: false };
    if (!same) ui = freshUi();
    view = 'poll';
    await commit();
  }

  async function saveAnswer() {
    const name = ui.name.trim().replace(/\s+/g, ' ');
    const hint = $('#ans-hint');
    if (!name) {
      hint.textContent = 'Indiquez votre prénom pour enregistrer.';
      hint.classList.add('error');
      $('#ans-name').focus();
      return;
    }
    const st = poll.st, key = norm(name), u = nowU();
    let list = st.p.slice();
    if (ui.editing && norm(ui.editing) !== key) {
      list = list.map((p) => (norm(p[0]) === norm(ui.editing) ? [p[0], 0, u] : p));
    }
    const idx = list.findIndex((p) => norm(p[0]) === key);
    if (idx < 0 && activePeople({ p: list }).length >= MAX_PEOPLE) {
      hint.textContent = `Le sondage est complet (${MAX_PEOPLE} personnes maximum).`;
      hint.classList.add('error');
      return;
    }
    const entry = [name, ui.vals.join(''), u];
    if (idx >= 0) list[idx] = entry; else list.push(entry);
    st.p = list;
    ui = freshUi();
    ui.flash = 'saved';
    await commit(name);
    scrollToId(poll.example ? 'app' : 'share');
  }

  async function deleteAnswer() {
    const name = ui.editing;
    const u = nowU();
    poll.st.p = poll.st.p.map((p) => (norm(p[0]) === norm(name) ? [p[0], 0, u] : p));
    ui = freshUi();
    await commit();
  }

  async function setFinal(i) {
    poll.st.f = [i, nowU()];
    ui = freshUi();
    ui.flash = i >= 0 ? 'final' : '';
    await commit();
  }

  async function mergePasted() {
    const text = $('#merge-in').value;
    const code = extractCode(text);
    if (!code) { ui.mergeMsg = 'Aucun sondage reconnu. Collez le lien complet.'; renderPoll(); return; }
    let other;
    try { other = await decodeCode(code); } catch (e) { ui.mergeMsg = 'Ce lien est incomplet ou abîmé.'; renderPoll(); return; }
    if (other.i !== poll.st.i) {
      ui.mergeMsg = `Ce lien correspond à un autre sondage («&nbsp;${esc(other.t || 'Repas')}&nbsp;»). <a href="#${esc(code)}">L’ouvrir</a>`;
      renderPoll();
      return;
    }
    const before = activePeople(poll.st).length;
    poll.st = merge(poll.st, other);
    const after = activePeople(poll.st).length;
    ui.mergeMsg = `Réponses réunies : ${plural(after, 'personne')} au total${after > before ? ` (${after - before} de plus)` : ''}.`;
    await commit();
  }

  async function copyLink(btn) {
    const input = $('#share-link');
    try {
      await navigator.clipboard.writeText(input.value);
      btn.textContent = 'Lien copié';
    } catch (e) {
      input.focus();
      input.select();
      btn.textContent = 'Sélectionné : copiez-le';
    }
    setTimeout(() => { if (btn.isConnected) btn.textContent = 'Copier le lien'; }, 2500);
  }

  function cycleSlot(el) {
    const i = +el.dataset.i;
    const v = ((ui.vals[i] || 0) + 1) % 3;
    ui.vals[i] = v;
    el.className = 'sbtn s' + v;
    el.setAttribute('aria-label', slotAria(poll.slots[i], v));
    $('#ans-count').textContent = answerCountText();
  }
  function bulk(v) {
    ui.vals = ui.vals.map(() => v);
    app.querySelectorAll('.sbtn').forEach((el) => {
      const i = +el.dataset.i;
      el.className = 'sbtn s' + v;
      el.setAttribute('aria-label', slotAria(poll.slots[i], v));
    });
    $('#ans-count').textContent = answerCountText();
  }

  function scrollToId(id) {
    const el = id === 'app' ? app : document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
  }

  function pasteOpen() {
    const msg = $('#p-msg');
    const code = extractCode($('#p-in').value);
    if (!code) { msg.hidden = false; msg.textContent = 'Aucun sondage reconnu. Collez le lien complet.'; return; }
    location.hash = code;
  }

  function exampleState() {
    const s = todayDay + 6, e = s + 20;
    const st = { v: 1, i: 'exemple', t: 'Raclette de décembre', n: 'Chez Léa · chacun apporte un fromage', s: ymd(s, ''), e: ymd(e, ''), m: [0, 0, 0, 0, 16, 20, 4], x: [], p: [], f: null };
    const slots = buildSlots(st);
    const names = ['Léa', 'Karim', 'Sophie', 'Hugo', 'Inès'];
    let seed = 11;
    const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
    const grid = names.map(() => slots.map(() => { const r = rnd(); return r < 0.45 ? '1' : r < 0.6 ? '2' : '0'; }));
    const star = Math.min(slots.length - 1, Math.floor(slots.length * 0.6));
    slots.forEach((_, i) => {
      if (i === star) { names.forEach((_, k) => { grid[k][i] = k === 3 ? '2' : '1'; }); return; }
      if (names.every((_, k) => grid[k][i] !== '0')) grid[i % names.length][i] = '0';
    });
    st.p = names.map((nm, k) => [nm, grid[k].join(''), 1000 + k]);
    return st;
  }

  /* ---------- Événements ---------- */
  function focusSelector(el) {
    let sel = `[data-act="${el.dataset.act}"]`;
    for (const k of ['t', 'w', 'd', 'p', 'i']) if (el.dataset[k] != null) sel += `[data-${k}="${el.dataset[k]}"]`;
    return sel;
  }

  app.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el || !app.contains(el)) return;
    const act = el.dataset.act;
    const hadFocus = document.activeElement === el;
    const refocus = () => { if (hadFocus) { const n = app.querySelector(focusSelector(el)); if (n) n.focus({ preventScroll: true }); } };
    switch (act) {
      case 'moment': toggleMoment(+el.dataset.t); renderCreateDynamic(); refocus(); break;
      case 'day': toggleDay(+el.dataset.w); renderCreateDynamic(); refocus(); break;
      case 'preset': preset(el.dataset.p); renderCreateDynamic(); break;
      case 'cell': draft.m[+el.dataset.w] ^= 1 << +el.dataset.t; renderCreateDynamic(); refocus(); break;
      case 'excl': { const d = +el.dataset.d; if (draft.x.has(d)) draft.x.delete(d); else draft.x.add(d); renderCreateDynamic(); refocus(); break; }
      case 'create': createPoll(); break;
      case 'paste-open': pasteOpen(); break;
      case 'open-answer': openAnswer(null); renderPoll(); scrollToId('answer'); { const n = $('#ans-name'); if (n) n.focus({ preventScroll: true }); } break;
      case 'edit': openAnswer(el.dataset.name); renderPoll(); scrollToId('answer'); break;
      case 'close-answer': ui = freshUi(); renderPoll(); scrollToId('answer'); break;
      case 'slot': cycleSlot(el); break;
      case 'bulk': bulk(+el.dataset.v); break;
      case 'save': saveAnswer(); break;
      case 'del-ask': ui.delAsk = true; renderPoll(); { const n = $('[data-act="del-confirm"]'); if (n) n.focus({ preventScroll: true }); } break;
      case 'del-cancel': ui.delAsk = false; renderPoll(); break;
      case 'del-confirm': deleteAnswer(); break;
      case 'copy': copyLink(el); break;
      case 'final': setFinal(+el.dataset.i).then(() => scrollToId(poll.example ? 'app' : 'share')); break;
      case 'unfinal': setFinal(-1); break;
      case 'merge': mergePasted(); break;
    }
  });

  function onDateChange(t) {
    const v = parseYmd(t.value);
    if (t.id === 'c-start') {
      draft.s = v;
      if (Number.isFinite(v) && Number.isFinite(draft.e) && draft.e < v) { draft.e = v + 27; $('#c-end').value = ymd(draft.e); }
    } else {
      draft.e = v;
    }
    renderCreateDynamic();
  }
  app.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.id === 'c-title') draft.t = t.value;
    else if (t.id === 'c-note') draft.n = t.value;
    else if (t.id === 'c-start' || t.id === 'c-end') onDateChange(t);
    else if (t.id === 'ans-name') {
      ui.name = t.value;
      const h = $('#ans-hint');
      h.classList.remove('error');
      h.textContent = nameHint(t.value);
    } else if (t.id === 'p-in') { const m = $('#p-msg'); if (m) m.hidden = true; }
  });
  app.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.id === 'c-start' || t.id === 'c-end') onDateChange(t);
  });
  app.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter') return;
    if (ev.target.id === 'ans-name') { ev.preventDefault(); saveAnswer(); }
    else if (ev.target.id === 'p-in') { ev.preventDefault(); pasteOpen(); }
  });

  /* ---------- Navigation ---------- */
  async function route() {
    const raw = location.hash.replace(/^#/, '');
    let h;
    try { h = decodeURIComponent(raw); } catch (e) { h = raw; }
    if (h === lastHash && view) return;
    lastHash = h;
    if (!h || h === 'nouveau') { showCreate(); window.scrollTo(0, 0); return; }
    if (h === 'exemple') {
      poll = { st: exampleState(), code: '', example: true };
      ui = freshUi();
      view = 'poll';
      renderPoll();
      window.scrollTo(0, 0);
      return;
    }
    const code = extractCode(h);
    if (!code) { showCreate(); return; }
    view = 'loading';
    app.innerHTML = '<p class="loading">Ouverture du sondage…</p>';
    try {
      const st = await decodeCode(code);
      await openState(st);
      window.scrollTo(0, 0);
    } catch (err) {
      showCreate(err && err.message === 'nozip'
        ? 'Ce navigateur est trop ancien pour lire ce lien. Essayez avec un navigateur à jour.'
        : 'Ce lien de sondage est incomplet ou abîmé. Demandez à la personne de le renvoyer en entier.');
    }
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body>
</html>
