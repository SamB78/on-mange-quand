<head>

<script>
  // Ancienne adresse : on renvoie vers la nouvelle, sauf pour un lien de sondage de l'ancienne version.
  (function () {

</script>

  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 32rem; margin: 0 auto; padding: 48px 16px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-family: Georgia, serif; font-weight: 400; font-size: 2rem; margin: 0; }
  p { margin: 0; color: var(--muted); }
  a { color: var(--accent); font-weight: 600; }
  .btn { align-self: flex-start; background: var(--accent); color: var(--accent-ink); text-decoration: none; padding: 12px 18px; border-radius: 10px; }
  .oldmsg { display: none; flex-direction: column; gap: 14px; }
  .old .oldmsg { display: flex; }
  .old .moved { display: none; }
</style>
</head>
<body>

<script>
