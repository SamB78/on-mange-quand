  app.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el || !app.contains(el)) return;
    const act = el.dataset.act;
    const hadFocus = document.activeElement === el;
    const refocus = () => { if (hadFocus) { const n = app.querySelector(focusSelector(el)); if (n) n.focus({ preventScroll: true }); } };
    switch (act) {
      case 'moment': toggleMoment(+el.dataset.t); renderCreateDynamic(); refocus(); break;
      case 'day': toggleDay(+el.dataset.w); renderCreateDynamic(); refocus(); break;
      case 'preset': preset(el.dataset.p); renderCreateDynamic(); break;
      case 'cell': draft.m[+el.dataset.w] ^= 1 << +el.dataset.t; renderCreateDynamic(); refocus(); break;
      case 'excl': toggleCalDay(+el.dataset.d); renderCreateDynamic(); refocus(); break;
      case 'add-hols': {
        const added = addHolidays(); renderCreateDynamic();
        // Le bouton disparaît : le focus passe au premier jour ajouté dans l'aperçu.
        const n = added.length && $(`[data-act="excl"][data-d="${added[0]}"]`); if (hadFocus && n) n.focus({ preventScroll: true });
        showToast(added.length > 1 ? `${added.length} jours fériés ajoutés au sondage.` : 'Jour férié ajouté au sondage.');
        break;
      }
      case 'create': createPoll(el); break;
      case 'retry': lastRoute = el.dataset.id; loadPoll(el.dataset.id); break;
      case 'open-answer': {
        openAnswer(null); renderPoll(); scrollToId('answer');
        const n = $('#ans-name'); if (n) n.focus({ preventScroll: true });
        break;
      }
      case 'edit': openAnswer(el.dataset.name); renderPoll(); scrollToId('answer'); break;
      case 'close-answer': { const created = ui.created; ui = freshUi(); ui.created = created; renderPoll(); scrollToId('answer'); break; }
      case 'slot': cycleSlot(el); break;
      case 'bulk': bulk(+el.dataset.v); break;
      case 'fill-free': setVals((i) => (conflictOf(i) ? 0 : 1)); break;
      case 'agenda-google': compareGoogle(el); break;
      case 'save': saveAnswer(el); break;
      case 'del-ask': {
        ui.delAsk = true; renderPoll();
        const n = $('[data-act="del-confirm"]'); if (n) n.focus({ preventScroll: true });
        break;
      }
      case 'del-cancel': ui.delAsk = false; renderPoll(); break;
      case 'del-confirm': deleteAnswer(el); break;
      case 'copy': copyLink(el); break;
      case 'edit-poll': startEdit(); break;
      case 'edit-cancel': leaveEdit(); break;
      case 'save-poll': savePoll(el); break;
      case 'poll-del-ask': {
        ui.pollDelAsk = true; renderPoll();
        const n = $('[data-act="poll-del-confirm"]'); if (n) n.focus({ preventScroll: true });
        break;
      }
      case 'poll-del-cancel': ui.pollDelAsk = false; renderPoll(); break;
      case 'poll-del-confirm': deletePoll(el); break;
      case 'toggle-closed': toggleClosed(el); break;
      case 'google': signInGoogle(el); break;
      case 'auth-mode': { const em = $('#au-email'); if (em) account.email = em.value; account.mode = el.dataset.m; showAccount(); const n = $('#au-email'); if (n) n.focus(); break; }
      case 'back': if (history.length > 1) history.back(); else location.hash = 'nouveau'; break;
      case 'reset': resetPassword(el); break;
      case 'logout': logout(el); break;
      case 'verify-again': verifyAgain(el); break;
      case 'acct-del-ask': account.delAsk = true; showAccount(); { const n = $('#del-pass') || $('[data-act="acct-del-confirm"]'); if (n) n.focus(); } break;
      case 'acct-del-cancel': account.delAsk = false; showAccount(); break;
      case 'acct-del-confirm': deleteAccount(el); break;
      case 'feed-create': changeFeed(el, 'POST', 'Création…'); break;
      case 'feed-renew': changeFeed(el, 'POST', 'Changement…'); break;
      case 'feed-off': changeFeed(el, 'DELETE', 'Désactivation…'); break;
      case 'feed-ask': account.feedAsk = el.dataset.p; paintFeed(); { const n = document.querySelector('#me-feed .confirm .btn'); if (n) n.focus(); } break;
      case 'feed-cancel': account.feedAsk = null; paintFeed(); break;
      case 'final': setFinal(el, +el.dataset.i); break;
      case 'unfinal': setFinal(el, -1); break;
    }
  });

  function onDateChange(t) {
    const v = parseYmd(t.value);
    if (t.id === 'c-start') {
      draft.s = v;
      if (Number.isFinite(v) && Number.isFinite(draft.e) && draft.e < v) { draft.e = v + 27; $('#c-end').value = ymd(draft.e); }
    } else {
      draft.e = v;
    }
    renderCreateDynamic();
  }
  app.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.id === 'c-title') draft.t = t.value;
    else if (t.id === 'c-note') draft.n = t.value;
    else if (t.id === 'c-pin' || t.id === 'pin-input') {
      const digits = t.value.replace(/\D/g, '').slice(0, 6);
      if (digits !== t.value) t.value = digits;
      if (t.id === 'c-pin') { draft.pin = digits; renderCreateDynamic(); }
    }
    else if (t.id === 'c-start' || t.id === 'c-end') onDateChange(t);
    else if (t.id === 'ans-note') ui.note = t.value;
    else if (t.id === 'ans-name') {
      ui.name = t.value;
      const h = $('#ans-hint');
      h.classList.remove('error');
      h.textContent = nameHint(t.value);
    }
  });
  app.addEventListener('submit', (ev) => {
    if (ev.target.id === 'auth-form') { ev.preventDefault(); submitAuth(); }
    else if (ev.target.id === 'pin-form') { ev.preventDefault(); submitPin(); }
  });
  app.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.id === 'c-start' || t.id === 'c-end') onDateChange(t);
  });
  app.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && (ev.target.id === 'ans-name' || ev.target.id === 'ans-note')) {
      ev.preventDefault();
      saveAnswer($('[data-act="save"]'));
    }
  });

  /* ---------- Navigation ---------- */
  function route() {
    const h = location.hash.replace(/^#/, '');
    if (h === lastRoute && view) return;
    const previous = lastRoute;
    lastRoute = h;
    stopRefresh();
    if (h === 'compte') {
      if (previous && previous !== 'compte' && previous !== 'confidentialite') accountReturn = previous;
      account = { mode: 'in', delAsk: false };
      showAccount();
      window.scrollTo(0, 0);
      return;
    }
    if (h === 'confidentialite') { showPrivacy(); window.scrollTo(0, 0); return; }
    if (!h || h === 'nouveau') { showCreate(); window.scrollTo(0, 0); return; }
    if (h === 'exemple') {
      poll = { st: exampleState(), example: true };
      ui = freshUi();
      view = 'poll';
      renderPoll();
      window.scrollTo(0, 0);
      return;
    }
    const link = /^([a-z2-7]{10})(?:-[a-z2-7]{20,64})?$/.exec(h);
    if (link) {
      const id = link[1];
      loadPoll(id).then(() => window.scrollTo(0, 0));
      return;
    }
    showCreate('Ce lien ne correspond à aucun sondage. Vérifiez qu’il a été copié en entier.');
  }
  window.addEventListener('hashchange', route);
  authReady.then(route);
})();
</script>
<script type="module">
// Connexion par Firebase Authentication. Ces valeurs sont publiques : elles désignent le projet Firebase, rien de plus.
const SDK = 'https://www.gstatic.com/firebasejs/13.1.0/';
const LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
const CONFIG = LOCAL
  ? { apiKey: 'demo-cle-locale', authDomain: 'localhost', projectId: 'demo-omq' } // émulateur local : npm run auth:local
  : {
      apiKey: 'AIzaSyCWEeqOLSoIuYSICVr7heOH1mQMI3VWdt8',
      authDomain: 'on-mange-quand-5a00a.firebaseapp.com',
      projectId: 'on-mange-quand-5a00a',
      appId: '1:704019232045:web:0f4fab0151c054cd498fa4',
    };

const MESSAGES = {
  'auth/invalid-credential': 'E-mail ou mot de passe incorrect.',
  'auth/invalid-login-credentials': 'E-mail ou mot de passe incorrect.',
  'auth/wrong-password': 'Mot de passe incorrect.',
  'auth/user-not-found': 'E-mail ou mot de passe incorrect.',
  'auth/email-already-in-use': 'Un compte existe déjà avec cette adresse. Connectez-vous, ou utilisez « Mot de passe oublié ».',
  'auth/weak-password': 'Mot de passe trop court : 6 caractères minimum.',
  'auth/invalid-email': 'Adresse e-mail invalide.',
  'auth/missing-password': 'Indiquez votre mot de passe.',
  'auth/too-many-requests': 'Trop de tentatives. Réessayez dans quelques minutes.',
  'auth/popup-blocked': 'La fenêtre Google a été bloquée. Autorisez les fenêtres pop-up pour ce site, puis réessayez.',
  'auth/network-request-failed': 'Connexion impossible. Vérifiez votre réseau.',
  'auth/user-disabled': 'Ce compte a été désactivé.',
  'auth/account-exists-with-different-credential': 'Un compte existe déjà avec cette adresse : connectez-vous avec votre mot de passe.',
  'auth/requires-recent-login': 'Par sécurité, reconnectez-vous puis réessayez.',
  'auth/user-mismatch': 'Ce n’est pas le compte connecté. Réessayez avec le bon compte.',
  'auth/operation-not-allowed': 'Ce mode de connexion n’est pas encore activé.',
};
const SILENT = ['auth/popup-closed-by-user', 'auth/cancelled-popup-request', 'auth/user-cancelled'];
function friendly(e) {
  const code = (e && e.code) || '';
  const err = new Error(MESSAGES[code] || 'La connexion a échoué. Réessayez.');
  err.code = code;
  err.silent = SILENT.includes(code);
  return err;
}

if (!CONFIG.apiKey) {
  window.omqAuthDisabled();
} else {
  try {
    const [{ initializeApp }, fa] = await Promise.all([import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js')]);
    const a = fa.getAuth(initializeApp(CONFIG));
    a.languageCode = 'fr';
    if (LOCAL) fa.connectAuthEmulator(a, 'http://127.0.0.1:9099', { disableWarnings: true });
    const google = new fa.GoogleAuthProvider();
    google.setCustomParameters({ prompt: 'select_account' });
    const toUser = (u) => u && {
      uid: u.uid,
      email: u.email || '',
      name: u.displayName || '',
      verified: !!u.emailVerified,
      provider: u.providerData.some((p) => p.providerId === 'google.com') ? 'google' : 'password',
    };
    const guard = (fn) => async (...args) => { try { return await fn(...args); } catch (e) { throw friendly(e); } };
    let listener = () => {};
    window.omqAuthAttach({
      onChange(cb) { listener = cb; fa.onAuthStateChanged(a, (u) => cb(toUser(u))); },
      token: (force) => (a.currentUser ? a.currentUser.getIdToken(!!force) : Promise.resolve(null)),
      signIn: guard((email, password) => fa.signInWithEmailAndPassword(a, email, password)),
      signUp: guard(async (name, email, password) => {
        const { user } = await fa.createUserWithEmailAndPassword(a, email, password);
        if (name) await fa.updateProfile(user, { displayName: name });
        fa.sendEmailVerification(user).catch(() => {});
        listener(toUser(user)); // le prénom vient d'être ajouté : on prévient la page
      }),
      google: guard(() => fa.signInWithPopup(a, google)),
      reset: guard((email) => fa.sendPasswordResetEmail(a, email)),
      verify: guard(() => fa.sendEmailVerification(a.currentUser)),
      logout: () => fa.signOut(a),
      reauth: guard(async (password) => {
        const u = a.currentUser;
        if (u.providerData.some((p) => p.providerId === 'password')) {
          await fa.reauthenticateWithCredential(u, fa.EmailAuthProvider.credential(u.email, password));
        } else {
          await fa.reauthenticateWithPopup(u, google);
        }
      }),
      remove: guard(() => fa.deleteUser(a.currentUser)),
    });
  } catch (e) {
    console.error('Connexion indisponible :', e);
    window.omqAuthDisabled();
  }
}
</script>
