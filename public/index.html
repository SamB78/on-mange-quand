<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap">
<style>
:root {
  /* Layout : une colonne centrée (46rem) sous une bande vichy ; le créneau gagnant s'affiche sur une ardoise de bistrot */
  --paper: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #18202E;
  --muted: #5A6476;
  --line: #D9DFE8;
  --accent: #2A52BE;
  --accent-ink: #FFFFFF;
  --accent-soft: #E4EAFA;
  --ging: rgba(42, 82, 190, 0.30);
  --yes: #17824A;
  --yes-soft: #DCF1E4;
  --maybe: #9A6200;
  --maybe-soft: #FAEBCB;
  --danger: #B93228;
  --hol: #AD2D66;
  --hol-soft: #FBE8F1;
  --slate: #232A30;
  --chalk: #F1EFE7;
  --chalk-dim: #A9B1B7;
  --chalk-line: rgba(241, 239, 231, 0.18);
  --chalk-yes: #9FE3B9;
  --chalk-maybe: #F3CD7E;
  --shadow: 0 1px 2px rgba(24, 32, 46, 0.05), 0 6px 20px rgba(24, 32, 46, 0.05);
  --font-display: "Young Serif", "Iowan Old Style", Georgia, serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F131A; --surface: #171D26; --ink: #E7EBF2; --muted: #9AA4B5; --line: #2A3342;
    --accent: #87A4FF; --accent-ink: #0D1530; --accent-soft: #1E2944; --ging: rgba(135, 164, 255, 0.24);
    --yes: #55C98A; --yes-soft: #163726; --maybe: #E9B24D; --maybe-soft: #3A2C10; --danger: #F07A6E;
    --hol: #F28DBB; --hol-soft: #3A1828;
    --slate: #0A0E12; --chalk: #F1EFE7; --chalk-dim: #9AA3AA; --chalk-line: rgba(241, 239, 231, 0.15);
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F131A; --surface: #171D26; --ink: #E7EBF2; --muted: #9AA4B5; --line: #2A3342;
  --accent: #87A4FF; --accent-ink: #0D1530; --accent-soft: #1E2944; --ging: rgba(135, 164, 255, 0.24);
  --yes: #55C98A; --yes-soft: #163726; --maybe: #E9B24D; --maybe-soft: #3A2C10; --danger: #F07A6E;
  --hol: #F28DBB; --hol-soft: #3A1828;
  --slate: #0A0E12; --chalk: #F1EFE7; --chalk-dim: #9AA3AA; --chalk-line: rgba(241, 239, 231, 0.15);
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.band {
  height: 20px; background-color: var(--surface);
  background-image: linear-gradient(90deg, var(--ging) 50%, transparent 50%), linear-gradient(var(--ging) 50%, transparent 50%);
  background-size: 20px 20px; border-bottom: 1px solid var(--line);
}
.wrap {
  max-width: 46rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 88px;
  display: flex; flex-direction: column; gap: 22px;
}
.slot { display: contents; }
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: -0.005em; }
h1 { font-size: clamp(2rem, 7vw, 2.8rem); line-height: 1.08; }
h2 { font-size: 1.3rem; line-height: 1.25; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: 0.88rem; }
.hint:empty { display: none; }
.error { color: var(--danger); font-weight: 600; font-size: 0.92rem; }
.eyebrow { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }

/* Accueil */
.hero { display: flex; flex-direction: column; gap: 12px; }
.lede { color: var(--muted); font-size: 1.06rem; max-width: 36rem; }
.hero-links { display: flex; flex-wrap: wrap; gap: 10px; }

.card {
  --pad: 20px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: var(--pad); display: flex; flex-direction: column; gap: 20px; box-shadow: var(--shadow);
}
@media (min-width: 600px) { .card { --pad: 26px; } }

.field { display: flex; flex-direction: column; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > label, .field > legend, .label { font-weight: 600; font-size: 0.92rem; padding: 0; }
.opt { font-weight: 400; color: var(--muted); }
input[type="text"], input[type="date"], input[type="email"], input[type="password"] {
  font: inherit; color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  width: 100%; min-width: 0; min-height: 46px;
}
input:focus { border-color: var(--accent); outline: 2px solid var(--accent-soft); outline-offset: 0; }
.dates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.dates label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--muted); font-weight: 500; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.chip {
  font: inherit; font-weight: 600; font-size: 0.95rem; min-height: 44px; padding: 8px 16px;
  border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  cursor: pointer; transition: background-color .15s, border-color .15s, color .15s;
}
.chips.days .chip { padding: 8px 0; font-size: 0.88rem; border-radius: 12px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.85rem; color: var(--muted); }
.mini {
  font: inherit; font-size: 0.85rem; font-weight: 600; min-height: 36px; padding: 6px 12px;
  border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
}
details > summary { cursor: pointer; font-weight: 600; color: var(--accent); min-height: 32px; display: list-item; }
.fine-body { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
.matrix-scroll { overflow-x: auto; }
.matrix { border-collapse: separate; border-spacing: 4px; }
.matrix th { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-align: center; }
.matrix th[scope="row"] { text-align: left; padding-right: 8px; white-space: nowrap; color: var(--ink); font-size: 0.85rem; }
.mcell {
  width: 38px; height: 38px; border-radius: 9px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--accent-ink); font: inherit; font-weight: 700; cursor: pointer; padding: 0;
}
.mcell[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.mcell[aria-pressed="true"]::after { content: "✓"; }

.preview-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.count { font-weight: 700; font-variant-numeric: tabular-nums; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .wh { font-size: 0.7rem; text-align: center; color: var(--muted); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding-bottom: 2px; }
.cal .mh { grid-column: 1 / -1; font-size: 0.8rem; font-weight: 700; color: var(--muted); padding-top: 8px; }
.cal .mh::first-letter { text-transform: uppercase; }
.cd {
  height: 46px; border-radius: 10px; border: 1.5px solid transparent; background: transparent; color: var(--muted);
  font: inherit; font-size: 0.92rem; font-variant-numeric: tabular-nums; padding: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
}
.cd.off { opacity: 0.4; }
.cd.on { background: var(--accent-soft); color: var(--ink); font-weight: 700; cursor: pointer; }
.cd.ex { border: 1.5px dashed var(--line); text-decoration: line-through; cursor: pointer; }
.dots { display: flex; gap: 2px; }
.dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
/* Jours fériés : cerclés de framboise ; hors des jours choisis, en pointillés et touchables pour les ajouter */
.cd.hol { color: var(--hol); border-color: var(--hol); }
.cd.hol.off { opacity: 1; border-style: dashed; cursor: pointer; font-weight: 600; }
.hols { display: flex; flex-direction: column; gap: 8px; background: var(--hol-soft); border-radius: 10px; padding: 10px 12px; font-size: 0.88rem; }
.hols.todo { outline: 1.5px dashed var(--hol); outline-offset: -1.5px; }
.hols b { color: var(--hol); font-weight: 700; }
.hols .hol-act { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.hols .mini { border-color: var(--hol); color: var(--hol); background: var(--surface); }
.hol-name { display: block; font-size: 0.75rem; font-weight: 600; color: var(--hol); }
.hol-txt { color: var(--hol); font-weight: 600; }
.nowrap { white-space: nowrap; }
/* Code d'accès */
.code-input { font-variant-numeric: tabular-nums; letter-spacing: 0.3em; max-width: 12rem; }
.code-input.big { font-size: 1.5rem; text-align: center; max-width: none; }
.code { font-variant-numeric: tabular-nums; letter-spacing: 0.12em; }

/* Boutons */
.btn {
  font: inherit; font-weight: 600; min-height: 46px; padding: 10px 18px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; text-align: center;
  transition: background-color .15s, border-color .15s, transform .1s;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { width: 100%; min-height: 54px; font-size: 1.06rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn.danger { background: transparent; color: var(--danger); border-color: currentColor; }
.btn.chalk { background: var(--chalk); border-color: var(--chalk); color: var(--slate); }
.btn.chalk-ghost { background: transparent; border-color: var(--chalk-line); color: var(--chalk); }
.linkbtn {
  background: none; border: 0; padding: 6px 0; font: inherit; font-weight: 600; color: var(--accent);
  cursor: pointer; text-decoration: underline; text-underline-offset: 3px; min-height: 36px;
}
.linkbtn.danger { color: var(--danger); }

/* Mes sondages */
.mine { display: flex; flex-direction: column; gap: 10px; }
.mine ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mine a {
  display: flex; justify-content: space-between; align-items: baseline; gap: 4px 14px; flex-wrap: wrap;
  padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  text-decoration: none; color: var(--ink);
}
.mine .mt { font-weight: 600; }
.mine .ms { color: var(--muted); font-size: 0.88rem; font-variant-numeric: tabular-nums; }

.link-row { display: flex; gap: 8px; }
.link-row input { flex: 1; font-size: 0.9rem; color: var(--muted); }
@media (max-width: 480px) { .link-row { flex-direction: column; } }

/* Sondage */
.poll-head { display: flex; flex-direction: column; gap: 10px; }
.back { font-weight: 600; text-decoration: none; font-size: 0.92rem; align-self: flex-start; min-height: 32px; }
.note { font-size: 1.05rem; }
.meta { color: var(--muted); font-variant-numeric: tabular-nums; }
.banner {
  border: 1.5px dashed var(--maybe); background: var(--maybe-soft); border-radius: 12px; padding: 12px 16px;
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
}
.banner p { font-weight: 600; }

.verdict {
  position: relative; overflow: hidden; background: var(--slate); color: var(--chalk);
  border: 1px solid var(--chalk-line); border-radius: 16px; padding: 26px 24px;
  display: flex; flex-direction: column; gap: 12px;
}
.verdict::before {
  content: ""; position: absolute; inset: 7px; border: 1px solid var(--chalk-line); border-radius: 11px; pointer-events: none;
}
.verdict > * { position: relative; }
.v-label { font-size: 0.74rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--chalk-dim); font-weight: 700; }
.v-title { font-family: var(--font-display); font-size: clamp(1.6rem, 6vw, 2.2rem); line-height: 1.15; text-wrap: balance; }
.v-sub, .v-more { color: var(--chalk-dim); }
.v-more { font-size: 0.9rem; }
.v-score { font-variant-numeric: tabular-nums; }
.v-score b { font-size: 1.15rem; }
.who { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.who li { font-size: 0.88rem; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--chalk-line); }
.who .y { color: var(--chalk-yes); }
.who .m { color: var(--chalk-maybe); }
.who .n { color: var(--chalk-dim); text-decoration: line-through; }
.v-actions { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px; }
.ties { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--chalk-dim); font-size: 0.9rem; }
.tie {
  font: inherit; font-size: 0.85rem; color: var(--chalk); background: transparent; border: 1px dashed var(--chalk-line);
  border-radius: 8px; padding: 5px 10px; cursor: pointer; min-height: 34px;
}

.cta { display: flex; flex-direction: column; gap: 10px; }
.cta .hint { text-align: center; }
.okmsg { color: var(--yes); font-weight: 700; }
.cta .okmsg { text-align: center; }

.answer .ahead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.legend { font-size: 0.88rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-weight: 700; font-size: 0.8rem; }
.pill.s1 { background: var(--yes-soft); color: var(--yes); }
.pill.s2 { background: var(--maybe-soft); color: var(--maybe); }
.bulk { display: flex; gap: 8px; flex-wrap: wrap; }
.adays { display: flex; flex-direction: column; }
.amonth { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; padding: 16px 0 6px; }
.amonth:first-child { padding-top: 0; }
.arow {
  display: grid; grid-template-columns: 7.2rem minmax(0, 1fr); gap: 10px; align-items: center;
  padding-block: 8px; border-top: 1px solid var(--line);
}
.adate { font-variant-numeric: tabular-nums; font-weight: 600; }
.adate .wd { color: var(--muted); font-weight: 500; }
.aslots { display: flex; flex-wrap: wrap; gap: 6px; }
.sbtn {
  font: inherit; font-weight: 600; font-size: 0.92rem; min-height: 44px; padding: 8px 14px 8px 10px;
  border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  transition: background-color .12s, border-color .12s, color .12s;
}
.sbtn .mk {
  width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line);
  display: inline-grid; place-items: center; font-size: 0.78rem; line-height: 1; font-weight: 800; flex: none;
}
.sbtn.s1 { background: var(--yes-soft); border-color: var(--yes); color: var(--yes); }
.sbtn.s1 .mk { background: var(--yes); border-color: var(--yes); color: var(--surface); }
.sbtn.s1 .mk::before { content: "✓"; }
.sbtn.s2 { background: var(--maybe-soft); border-color: var(--maybe); border-style: dashed; color: var(--maybe); }
.sbtn.s2 .mk { border-color: var(--maybe); }
.sbtn.s2 .mk::before { content: "~"; }
@media (max-width: 440px) { .arow { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
/* Créneaux déjà pris (agenda Google, autres repas) : contour en pointillés rouges et petite mention */
.sbtn .sl { display: inline-flex; flex-direction: column; align-items: flex-start; line-height: 1.2; text-align: left; }
.sbtn .bz { font-size: 0.72rem; font-weight: 600; color: var(--danger); }
.sbtn.busy.s0 { border-style: dashed; border-color: var(--danger); }
.agenda-tools { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 0.88rem; color: var(--muted); }
.agenda-tools:empty { display: none; }
.agenda-tools .hint { flex-basis: 100%; font-size: 0.8rem; }
.mini.gcal { display: inline-flex; align-items: center; gap: 6px; }
.afoot {
  position: sticky; bottom: 0; z-index: 2;
  margin: 0 calc(-1 * var(--pad)) calc(-1 * var(--pad));
  padding: 12px var(--pad) calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line); border-radius: 0 0 16px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
}
.afoot .count { font-weight: 600; color: var(--muted); font-size: 0.92rem; }
.confirm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.share.flash { border-color: var(--yes); box-shadow: 0 0 0 3px var(--yes-soft); }
.share-actions { display: flex; flex-wrap: wrap; gap: 10px; }

.results { display: flex; flex-direction: column; gap: 12px; }
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.grid { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.grid th, .grid td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.grid thead th { font-size: 0.8rem; color: var(--muted); font-weight: 700; background: var(--surface); }
.grid tbody tr:last-child > * { border-bottom: 0; }
.grid .c-slot { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; border-right: 1px solid var(--line); }
.c-slot .d { display: block; font-weight: 600; color: var(--ink); }
.c-slot .t { display: block; font-size: 0.78rem; color: var(--muted); font-weight: 500; }
.tag {
  display: inline-block; margin-left: 6px; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--accent-ink); background: var(--accent); border-radius: 4px; padding: 1px 5px; vertical-align: 1px;
}
.c-score { min-width: 76px; }
.num { font-weight: 800; }
.of { color: var(--muted); }
.bar { display: block; height: 4px; background: var(--line); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--yes); }
.grid td.v1 { color: var(--yes); background: var(--yes-soft); font-weight: 800; }
.grid td.v2 { color: var(--maybe); background: var(--maybe-soft); font-weight: 800; }
.grid td.v0 { color: var(--muted); opacity: 0.5; }
.grid tr.best .c-slot, .grid tr.best .c-score, .grid tr.final .c-slot, .grid tr.final .c-score { background: var(--accent-soft); }
.who-btn {
  font: inherit; font-weight: 700; color: var(--accent); background: none; border: 0; cursor: pointer;
  padding: 4px 2px; max-width: 7rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  text-decoration: underline dotted; text-underline-offset: 3px;
}
.notes { display: flex; flex-direction: column; gap: 8px; }
.notes-h { margin: 0; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }
.notes ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.notes li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; overflow-wrap: anywhere; }
.notes .nn { font-weight: 700; margin-right: 6px; }
.agenda { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--chalk-line); }
.verdict a:not(.btn) { color: var(--chalk); }
.org-badge { align-self: flex-start; font-size: 0.8rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 12px; }
.card.org { border-style: dashed; border-color: var(--accent); }
.who-name { font-weight: 700; color: var(--ink); display: inline-block; max-width: 7rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
.topbar {
  max-width: 46rem; margin: 0 auto; display: flex; justify-content: flex-end; align-items: center; min-height: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 12px;
}
.topbar:empty { display: none; }
.account-link {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 14px 6px 6px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 0.9rem;
}
.account-link.out { padding-left: 14px; color: var(--accent); }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-size: 0.85rem; font-weight: 700; }
.notice { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; font-size: 0.95rem; }
.banner.closed { border-color: var(--muted); background: var(--surface); }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 0.85rem; }
.or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--paper); border-radius: 12px; padding: 4px; }
.tabs button { font: inherit; font-weight: 600; min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.auth-form { display: flex; flex-direction: column; gap: 16px; }
.btn.google { background: var(--surface); }
.btn.google svg { flex: none; }
.danger-zone { border-color: var(--line); }
.prose { display: flex; flex-direction: column; gap: 12px; max-width: 40rem; }
.prose h2 { margin-top: 10px; }
.prose ul { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 6px; }
.live { display: inline-flex; align-items: center; gap: 6px; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--yes); }

.loading { color: var(--muted); padding: 40px 0; text-align: center; }
.state { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; padding: 24px 0; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: max-content; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 12px;
  font-weight: 600; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
}
.toast.err { background: var(--danger); color: var(--surface); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="band" aria-hidden="true"></div>
<nav class="topbar" id="topbar" aria-label="Compte"></nav>
<main class="wrap" id="app"><p class="loading">Chargement…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';

  const STORE_KEY = 'on-mange-quand:v2';
  const DAY_MS = 86400000;
  const MAX_DAYS = 92, MAX_SLOTS = 200;
  const REFRESH_MS = 15000;
  const ID_RE = /^[a-z2-7]{10}$/;

  // L'ordre compte : il fixe l'ordre des créneaux dans une journée (même règle que le serveur).
  const MOMENTS = ['Journée', 'Matin', 'Midi', 'Après-midi', 'Soir'];
  const SOIR = 1 << 4;
  // Horaires indicatifs de chaque moment, heure de Paris (null = journée entière). Mêmes valeurs côté serveur.
  const MOMENT_HOURS = [null, ['0900', '1200'], ['1200', '1430'], ['1400', '1800'], ['1930', '2300']];
  const MAX_NOTE = 140;
  const WD = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
  const WD_LONG = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
  const STATE_LABEL = ['pas dispo', 'dispo', 'si besoin'];

  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');
  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const $ = (sel) => app.querySelector(sel);

  /* ---------- Outils ---------- */
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = (s) => String(s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
  const plural = (n, one, many) => n + ' ' + (n > 1 ? (many || one + 's') : one);
  const popcount = (r) => (r & 1) + ((r >> 1) & 1) + ((r >> 2) & 1) + ((r >> 3) & 1) + ((r >> 4) & 1);

  const todayDay = (() => { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / DAY_MS; })();
  function parseYmd(s) {
    const c = String(s || '').replace(/-/g, '');
    if (!/^\d{8}$/.test(c)) return NaN;
    return Date.UTC(+c.slice(0, 4), +c.slice(4, 6) - 1, +c.slice(6, 8)) / DAY_MS;
  }
  function ymd(d, sep) {
    const t = new Date(d * DAY_MS);
    return [t.getUTCFullYear(), String(t.getUTCMonth() + 1).padStart(2, '0'), String(t.getUTCDate()).padStart(2, '0')].join(sep == null ? '-' : sep);
  }
  const weekday = (d) => (new Date(d * DAY_MS).getUTCDay() + 6) % 7;
  const dateOf = (d) => new Date(d * DAY_MS).getUTCDate();
  const monthKey = (d) => { const t = new Date(d * DAY_MS); return t.getUTCFullYear() * 12 + t.getUTCMonth(); };
  const F = (o) => new Intl.DateTimeFormat('fr-FR', Object.assign({ timeZone: 'UTC' }, o));
  const fShort = F({ weekday: 'short', day: 'numeric', month: 'short' });
  const fLong = F({ weekday: 'long', day: 'numeric', month: 'long' });
  const fMonth = F({ month: 'long', year: 'numeric' });
  const fDM = F({ day: 'numeric', month: 'short' });
  const fWd = F({ weekday: 'short' });
  const fmt = (f, d) => f.format(new Date(d * DAY_MS));
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  /* ---------- Jours fériés (France métropolitaine) ---------- */
  // Dimanche de Pâques (calcul grégorien de Meeus), en jours depuis 1970.
  function easter(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    const n = h + l - 7 * m + 114;
    return Date.UTC(y, Math.floor(n / 31) - 1, (n % 31) + 1) / DAY_MS;
  }
  const holidayYears = new Map();
  function holidaysOf(y) {
    if (!holidayYears.has(y)) {
      const D = (mo, d) => Date.UTC(y, mo - 1, d) / DAY_MS;
      const p = easter(y);
      const map = new Map();
      [[D(1, 1), 'Jour de l’an'], [p + 1, 'Lundi de Pâques'], [D(5, 1), 'Fête du Travail'], [D(5, 8), 'Victoire 1945'],
        [p + 39, 'Ascension'], [p + 50, 'Lundi de Pentecôte'], [D(7, 14), 'Fête nationale'], [D(8, 15), 'Assomption'],
        [D(11, 1), 'Toussaint'], [D(11, 11), 'Armistice'], [D(12, 25), 'Noël'],
      ].forEach(([d, name]) => map.set(d, map.has(d) ? map.get(d) + ' et ' + name : name)); // l'Ascension tombe parfois un 1er ou un 8 mai
      holidayYears.set(y, map);
    }
    return holidayYears.get(y);
  }
  // Nom du jour férié, ou '' pour un jour ordinaire.
  const holiday = (d) => holidaysOf(new Date(d * DAY_MS).getUTCFullYear()).get(d) || '';

  let toastTimer = null;
  function showToast(msg, isError) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('err', !!isError);
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.hidden = true; }, isError ? 5000 : 3000);
  }

  /* ---------- Serveur ---------- */
  async function api(method, path, body, retry = true) {
    const headers = {};
    const token = await auth.token();
    if (token) headers.authorization = 'Bearer ' + token;
    if (body) headers['content-type'] = 'application/json';
    let res;
    try {
      res = await fetch('/api' + path, {
        method,
        headers,
        body: body ? JSON.stringify(body) : undefined,
        cache: 'no-store',
      });
    } catch (e) {
      const err = new Error('Connexion impossible. Vérifiez votre réseau et réessayez.');
      err.status = 0;
      throw err;
    }
    if (res.status === 401 && token && retry) {
      // Jeton refusé : on en redemande un neuf ; si ça ne suffit pas, on se déconnecte et on continue sans compte.
      const fresh = await auth.token(true).catch(() => null);
      if (fresh && fresh !== token) return api(method, path, body, false);
      await auth.logout();
      showToast('Votre session a expiré : vous êtes déconnecté.', true);
      return api(method, path, body, false);
    }
    let data = null;
    try { data = await res.json(); } catch (e) { /* réponse vide */ }
    if (!res.ok) {
      const err = new Error((data && data.error) || 'Le serveur a rencontré un problème. Réessayez dans un instant.');
      err.status = res.status;
      err.pin = !!(data && data.pin); // sondage protégé : il faut (re)donner le code
      throw err;
    }
    return data;
  }

  /* ---------- Créneaux ---------- */
  // Mêmes règles que le serveur. x : jours exclus ; a : jours ajoutés (fériés) hors des jours de la semaine choisis,
  // avec tous les moments du sondage. Les sondages d'avant les jours ajoutés n'ont pas de « a ».
  function buildSlots(st) {
    const s = parseYmd(st.s), e = parseYmd(st.e);
    const ex = new Set(st.x.map((o) => s + o));
    const add = new Set((st.a || []).map((o) => s + o));
    const all = st.m.reduce((u, r) => u | r, 0);
    const slots = [];
    for (let d = s; d <= e; d++) {
      if (ex.has(d)) continue;
      const r = st.m[weekday(d)] || (add.has(d) ? all : 0);
      for (let t = 0; t < MOMENTS.length; t++) if (r & (1 << t)) slots.push({ d, t });
    }
    return slots;
  }
  function computeStats(slots, people) {
    return slots.map((sl, i) => {
      let y = 0, mb = 0;
      for (const p of people) { const c = p[1][i]; if (c === '1') y++; else if (c === '2') mb++; }
      return { i, y, mb, tot: y + mb };
    });
  }
  const rank = (stats) => stats.slice().sort((a, b) => b.tot - a.tot || b.y - a.y || a.i - b.i);
  const slotLong = (sl) => cap(fmt(fLong, sl.d)) + ' · ' + MOMENTS[sl.t];
  const slotShort = (sl) => fmt(fShort, sl.d) + ' · ' + MOMENTS[sl.t].toLowerCase();
  function momentsUsed(m) {
    const u = m.reduce((a, r) => a | r, 0);
    return MOMENTS.filter((_, t) => u & (1 << t));
  }
  function daysLabel(m) {
    const key = m.map((r) => (r ? 1 : 0)).join('');
    if (key === '1111111') return '';
    if (key === '1111100') return 'en semaine';
    if (key === '0000011') return 'le week-end';
    return WD.filter((_, w) => m[w]).map((s) => s.toLowerCase()).join(', ');
  }

  /* ---------- Mémoire locale : vos sondages et votre prénom, sur cet appareil ---------- */
  function loadStore() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (s && typeof s === 'object' && s.polls && typeof s.polls === 'object') return s;
    } catch (e) { /* stockage indisponible */ }
    return { polls: {} };
  }
  function saveStore(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* ignoré */ } }
  function storePatch(id, patch) {
    const s = loadStore();
    s.polls[id] = Object.assign({}, s.polls[id] || {}, patch);
    saveStore(s);
  }
  function remember(st, me) {
    const s = loadStore();
    const prev = s.polls[st.i] || {};
    s.polls[st.i] = Object.assign({}, prev, { t: st.t, s: st.s, e: st.e, n: st.p.length, seen: Date.now(), own: !!st.isOwner, me: me !== undefined ? me : (prev.me || null) });
    Object.keys(s.polls)
      .sort((a, b) => (s.polls[b].seen || 0) - (s.polls[a].seen || 0))
      .slice(50)
      .forEach((id) => { delete s.polls[id]; });
    saveStore(s);
  }
  function forgetPoll(id) {
    const s = loadStore();
    delete s.polls[id];
    saveStore(s);
  }

  /* ---------- Compte (Firebase, branché par le module en bas de page) ---------- */
  // Sans compte, tout marche. Quand Firebase est prêt, il se branche ici ; s'il ne charge pas, l'app continue sans compte.
  const auth = {
    enabled: false,
    user: null, // { uid, email, name, verified, provider }
    impl: null,
    token(force) { return this.impl && this.user ? this.impl.token(force) : Promise.resolve(null); },
    async logout() { if (this.impl) await this.impl.logout(); },
  };
  let authSettled;
  const authReady = new Promise((resolve) => { authSettled = resolve; });
  setTimeout(() => authSettled(), 4000);
  window.omqAuthAttach = (impl) => {
    auth.impl = impl;
    auth.enabled = true;
    impl.onChange((user) => {
      const before = auth.user ? auth.user.uid : null;
      auth.user = user;
      renderTopbar();
      authSettled();
      if ((user ? user.uid : null) !== before) onAuthChanged();
    });
  };
  window.omqAuthDisabled = () => { authSettled(); renderTopbar(); };
  const displayName = () => (auth.user ? auth.user.name || auth.user.email.split('@')[0] : '');
  const slotsKeyOf = (st) => [st.s, st.e, st.m.join('.'), st.x.join('.')].concat(st.a && st.a.length ? [st.a.join('.')] : []).join('|');
  // Sans organisateur (sondage créé sans compte, exemple), tout le monde peut choisir la date.
  const canDecide = () => poll.example || !poll.st.owned || poll.st.isOwner;
  function getMe() {
    if (!poll || poll.example) return null;
    const p = loadStore().polls[poll.st.i];
    return (p && p.me) || null;
  }

  /* ---------- État ---------- */
  let view = null;      // 'create' | 'edit' | 'poll' | 'pin' | 'loading' | 'error' | 'account' | 'privacy'
  let lastRoute = null;
  let pinFor = null;    // sondage dont on demande le code
  let poll = null;      // { st, example, slots }
  let ui = freshUi();
  let busy = false;
  let refreshTimer = null;
  let accountReturn = null; // où revenir après la connexion
  let account = { mode: 'in', delAsk: false };
  function freshUi() { return { open: false, name: '', note: '', vals: [], editing: null, delAsk: false, savedName: '', created: false, pollDelAsk: false }; }

  function newDraft() {
    return {
      t: '', n: '',
      s: todayDay + 1, e: todayDay + 28,
      m: [SOIR, SOIR, SOIR, SOIR, SOIR, SOIR, SOIR],
      x: new Set(), // jours exclus
      a: new Set(), // jours fériés ajoutés hors des jours de la semaine choisis
      pin: '',
    };
  }
  let draft = newDraft();
  let createDraft = null; // brouillon de création mis de côté pendant la modification d'un sondage

  /* ---------- Vue : création ---------- */
  function showCreate(msg, editing) {
    if (!editing && createDraft) { draft = createDraft; createDraft = null; }
    view = editing ? 'edit' : 'create';
    if (!editing) poll = null;
    stopRefresh();
    const mine = editing ? [] : Object.entries(loadStore().polls)
      .map(([id, p]) => Object.assign({ id }, p))
      .filter((p) => ID_RE.test(p.id) && p.s && p.e)
      .sort((a, b) => b.seen - a.seen)
      .slice(0, 8);
    app.innerHTML = `
      ${editing ? `<header class="poll-head">
        <button type="button" class="back linkbtn" data-act="edit-cancel">← Retour au sondage</button>
        <h1>Modifier le sondage</h1>
        <p class="muted">Les dispos déjà données restent sur les créneaux conservés. Celles des créneaux retirés seront effacées.</p>
      </header>` : `<header class="hero">
        <p class="eyebrow">Sondage de dispos · sans compte</p>
        <h1>On mange quand&nbsp;?</h1>
        <p class="lede">Choisissez la période et les moments possibles, envoyez le lien au groupe&nbsp;: chacun coche ses dispos et le meilleur créneau ressort tout seul.</p>
        <p class="hero-links"><a class="btn" href="#exemple">Voir un exemple</a></p>
      </header>`}
      ${msg ? `<p class="error" role="alert">${esc(msg)}</p>` : ''}
      ${mine.length ? `<section class="mine"><h2>Vos sondages</h2><ul>${mine.map((p) =>
        `<li><a href="#${esc(p.id)}"><span class="mt">${esc(p.t || 'Repas')}</span><span class="ms">${fmt(fDM, parseYmd(p.s))} → ${fmt(fDM, parseYmd(p.e))} · ${plural(p.n || 0, 'réponse')}${p.own ? ' · vous organisez' : ''}</span></a></li>`).join('')}</ul></section>` : ''}
      <section class="card" aria-labelledby="c-h">
        <h2 id="c-h">${editing ? 'Réglages' : 'Nouveau sondage'}</h2>
        ${!editing && auth.enabled ? (auth.user
          ? '<p class="notice">Vous êtes connecté&nbsp;: vous serez l’organisateur. Vous seul pourrez choisir la date, modifier, clôturer ou supprimer ce sondage.</p>'
          : '<p class="notice">Sans compte, tout le monde pourra tout modifier. <a href="#compte">Connectez-vous</a> pour en être l’organisateur et pouvoir protéger le lien par un code (facultatif).</p>') : ''}
        <div class="field"><label for="c-title">Nom du repas</label><input type="text" id="c-title" maxlength="80" placeholder="Raclette de janvier" autocomplete="off"></div>
        <div class="field"><label for="c-note">Précisions <span class="opt">(facultatif)</span></label><input type="text" id="c-note" maxlength="160" placeholder="Chez Julie, chacun apporte un plat" autocomplete="off"></div>
        <fieldset class="field"><legend>Période</legend>
          <div class="dates">
            <label for="c-start">Du<input type="date" id="c-start"></label>
            <label for="c-end">Au<input type="date" id="c-end"></label>
          </div>
        </fieldset>
        <fieldset class="field"><legend>Moments possibles</legend><div class="chips" id="c-moments"></div></fieldset>
        <fieldset class="field"><legend>Jours possibles</legend>
          <div class="chips days" id="c-days"></div>
          <div class="presets">Raccourcis&nbsp;:
            <button type="button" class="mini" data-act="preset" data-p="all">Tous les jours</button>
            <button type="button" class="mini" data-act="preset" data-p="week">En semaine</button>
            <button type="button" class="mini" data-act="preset" data-p="weekend">Week-end</button>
          </div>
          <div class="hols" id="c-hols" aria-live="polite" hidden></div>
        </fieldset>
        <details id="c-fine">
          <summary>Ajuster jour par jour</summary>
          <div class="fine-body">
            <p class="hint">Par exemple&nbsp;: le soir en semaine, midi et soir le week-end.</p>
            <div class="matrix-scroll"><table class="matrix" id="c-matrix"></table></div>
          </div>
        </details>
        <div class="field">
          <div class="preview-head"><span class="label">Aperçu</span><span class="count" id="c-count"></span></div>
          <p class="hint">Touchez un jour pour l’exclure (anniversaire, week-end déjà pris…). Les jours fériés sont cerclés&nbsp;; en pointillés, touchez-les pour les ajouter.</p>
          <div class="cal" id="c-cal"></div>
        </div>
        ${auth.user ? `<div class="field">
          <label for="c-pin">Code d’accès <span class="opt">(facultatif)</span></label>
          <input type="text" id="c-pin" class="code-input" inputmode="numeric" maxlength="6" placeholder="4 à 6 chiffres" autocomplete="off" spellcheck="false">
          <p class="hint">${editing
            ? 'Laissez vide pour retirer le code. Si vous le changez, chacun devra saisir le nouveau.'
            : 'Avec un code, le lien seul ne suffit plus pour ouvrir le sondage. Vous le retrouverez sur la page du sondage tant que vous êtes connecté.'}</p>
        </div>` : ''}
        <p class="error" id="c-error" role="alert" hidden></p>
        <button type="button" class="btn primary big" id="c-create" data-act="${editing ? 'save-poll' : 'create'}">${editing ? 'Enregistrer les modifications' : 'Créer le sondage'}</button>
      </section>`;
    $('#c-title').value = draft.t;
    $('#c-note').value = draft.n;
    $('#c-start').value = Number.isFinite(draft.s) ? ymd(draft.s) : '';
    if (!editing) $('#c-start').min = ymd(todayDay);
    $('#c-end').value = Number.isFinite(draft.e) ? ymd(draft.e) : '';
    if ($('#c-pin')) $('#c-pin').value = draft.pin;
    renderCreateDynamic();
  }

  function draftCheck() {
    const { s, e } = draft;
    if (!Number.isFinite(s) || !Number.isFinite(e)) return { err: 'Choisissez une date de début et une date de fin.' };
    if (e < s) return { err: 'La date de fin doit être après la date de début.' };
    if (e - s >= MAX_DAYS) return { err: 'Période trop longue : 3 mois maximum.' };
    let slots = 0, days = 0;
    const all = draft.m.reduce((u, r) => u | r, 0);
    for (let d = s; d <= e; d++) {
      const r = draft.m[weekday(d)] || (draft.a.has(d) ? all : 0);
      if (!r || draft.x.has(d)) continue;
      days++; slots += popcount(r);
    }
    if (!slots) return { err: 'Aucun créneau : choisissez au moins un jour et un moment.', slots, days };
    if (slots > MAX_SLOTS) return { err: `Trop de créneaux (${slots}). Réduisez la période ou le nombre de moments (${MAX_SLOTS} maximum).`, slots, days };
    if (auth.user && draft.pin && !/^\d{4,6}$/.test(draft.pin)) return { err: 'Le code d’accès doit faire 4 à 6 chiffres.', slots, days };
    return { slots, days };
  }

  // Jours fériés de la période, et ceux qui tombent en dehors des jours choisis sans avoir été ajoutés.
  function draftHolidays() {
    const { s, e } = draft;
    const list = [];
    if (Number.isFinite(s) && Number.isFinite(e) && e >= s && e - s < MAX_DAYS) {
      for (let d = s; d <= e; d++) { const name = holiday(d); if (name) list.push({ d, name }); }
    }
    return { list, missing: list.filter((h) => !draft.m[weekday(h.d)] && !draft.a.has(h.d)) };
  }
  function holidaysHTML() {
    const { list, missing } = draftHolidays();
    if (!list.length) return '';
    const n = missing.length;
    return `<p>${list.length > 1 ? 'Jours fériés' : 'Jour férié'} sur la période&nbsp;: ${list.map((h) =>
      `<span class="nowrap"><b>${fmt(fShort, h.d)}</b> ${esc(h.name)}</span>`).join(' · ')}</p>
      ${n ? `<p class="hol-act"><span>${n > 1 ? `${n} tombent` : list.length > 1 ? 'Un tombe' : 'Il tombe'} en dehors des jours choisis.</span>
        <button type="button" class="mini" data-act="add-hols">${n > 1 ? `Ajouter ces ${n} jours` : 'L’ajouter au sondage'}</button></p>` : ''}`;
  }
  // Touche dans l'aperçu : un jour choisi s'exclut ; un jour férié hors des jours choisis s'ajoute (ou se retire).
  function toggleCalDay(d) {
    if (draft.m[weekday(d)]) {
      if (draft.x.has(d)) draft.x.delete(d); else draft.x.add(d);
    } else if (holiday(d)) {
      if (draft.a.has(d)) draft.a.delete(d); else { draft.a.add(d); draft.x.delete(d); }
    }
  }
  function addHolidays() {
    const days = draftHolidays().missing.map((h) => h.d);
    for (const d of days) { draft.a.add(d); draft.x.delete(d); }
    return days;
  }

  function renderCreateDynamic() {
    const union = draft.m.reduce((a, r) => a | r, 0);
    $('#c-moments').innerHTML = MOMENTS.map((label, t) =>
      `<button type="button" class="chip" data-act="moment" data-t="${t}" aria-pressed="${!!(union & (1 << t))}">${label}</button>`).join('');
    $('#c-days').innerHTML = WD.map((d, w) =>
      `<button type="button" class="chip" data-act="day" data-w="${w}" aria-pressed="${draft.m[w] !== 0}" aria-label="${WD_LONG[w]}">${d}</button>`).join('');
    $('#c-matrix').innerHTML =
      `<thead><tr><td></td>${WD.map((d) => `<th scope="col">${d}</th>`).join('')}</tr></thead><tbody>` +
      MOMENTS.map((label, t) => `<tr><th scope="row">${label}</th>${WD.map((d, w) =>
        `<td><button type="button" class="mcell" data-act="cell" data-w="${w}" data-t="${t}" aria-pressed="${!!(draft.m[w] & (1 << t))}" aria-label="${label}, ${WD_LONG[w]}"></button></td>`).join('')}</tr>`).join('') +
      '</tbody>';

    const chk = draftCheck();
    const cal = $('#c-cal');
    const { s, e } = draft;
    if (Number.isFinite(s) && Number.isFinite(e) && e >= s && e - s < MAX_DAYS) {
      let html = ['lu', 'ma', 'me', 'je', 've', 'sa', 'di'].map((d) => `<span class="wh">${d}</span>`).join('');
      const gStart = s - weekday(s), gEnd = e + (6 - weekday(e));
      for (let w0 = gStart; w0 <= gEnd; w0 += 7) {
        let label = null;
        if (w0 === gStart) label = s;
        else for (let k = w0; k <= Math.min(w0 + 6, e); k++) if (dateOf(k) === 1) label = k;
        if (label !== null) html += `<span class="mh">${fmt(fMonth, label)}</span>`;
        const all = draft.m.reduce((u, r) => u | r, 0);
        for (let k = w0; k < w0 + 7; k++) {
          if (k < s || k > e) { html += '<span class="cd" aria-hidden="true"></span>'; continue; }
          const hol = holiday(k);
          const r = draft.m[weekday(k)] || (hol && draft.a.has(k) ? all : 0);
          const holAttr = hol ? ` title="${esc(hol)}"` : '';
          if (!r) {
            html += hol
              ? `<button type="button" class="cd off hol" data-act="excl" data-d="${k}" aria-pressed="false" aria-label="${fmt(fLong, k)}, ${esc(hol)}, non retenu : touchez pour l’ajouter"${holAttr}>${dateOf(k)}</button>`
              : `<span class="cd off" aria-hidden="true">${dateOf(k)}</span>`;
            continue;
          }
          const ex = draft.x.has(k);
          html += `<button type="button" class="cd ${ex ? 'ex' : 'on'}${hol ? ' hol' : ''}" data-act="excl" data-d="${k}" aria-pressed="${!ex}" aria-label="${fmt(fLong, k)}${hol ? ', ' + esc(hol) : ''}${ex ? ', exclu' : ''}"${holAttr}>${dateOf(k)}${ex ? '' : `<span class="dots">${'<i></i>'.repeat(popcount(r))}</span>`}</button>`;
        }
      }
      cal.innerHTML = html;
    } else {
      cal.innerHTML = '';
    }
    const hols = $('#c-hols');
    const holHtml = holidaysHTML();
    hols.innerHTML = holHtml;
    hols.hidden = !holHtml;
    hols.classList.toggle('todo', !!hols.querySelector('[data-act="add-hols"]'));
    $('#c-count').textContent = chk.slots ? `${plural(chk.slots, 'créneau', 'créneaux')} sur ${plural(chk.days, 'jour')}` : '';
    const err = $('#c-error');
    err.hidden = !chk.err;
    err.textContent = chk.err || '';
    $('#c-create').disabled = !!chk.err || busy;
  }

  function toggleMoment(t) {
    const bit = 1 << t;
    const on = draft.m.some((r) => r & bit);
    if (on) { draft.m = draft.m.map((r) => r & ~bit); return; }
    const anyDay = draft.m.some((r) => r);
    draft.m = draft.m.map((r) => (anyDay ? (r ? r | bit : r) : bit));
  }
  function toggleDay(w) {
    if (draft.m[w]) { draft.m[w] = 0; return; }
    draft.m[w] = draft.m.reduce((a, r) => a | r, 0) || SOIR;
  }
  function preset(p) {
    const u = draft.m.reduce((a, r) => a | r, 0) || SOIR;
    draft.m = draft.m.map((_, w) => (p === 'all' || (p === 'week' && w < 5) || (p === 'weekend' && w >= 5)) ? u : 0);
  }

  function draftPayload() {
    return {
      t: draft.t.trim(),
      n: draft.n.trim(),
      s: ymd(draft.s, ''), e: ymd(draft.e, ''),
      m: draft.m.slice(),
      x: Array.from(draft.x).filter((d) => d >= draft.s && d <= draft.e).map((d) => d - draft.s),
      a: Array.from(draft.a).filter((d) => d >= draft.s && d <= draft.e && !draft.m[weekday(d)]).map((d) => d - draft.s),
      pin: auth.user ? draft.pin : '', // le code est réservé aux organisateurs connectés
    };
  }

  function startEdit() {
    const st = poll.st;
    const s = parseYmd(st.s);
    createDraft = draft;
    draft = {
      t: st.t, n: st.n, s, e: parseYmd(st.e), m: st.m.slice(),
      x: new Set(st.x.map((o) => s + o)), a: new Set((st.a || []).map((o) => s + o)), pin: st.pin || '',
    };
    showCreate('', true);
    window.scrollTo(0, 0);
  }
  function leaveEdit() {
    draft = createDraft || newDraft();
    createDraft = null;
    view = 'poll';
    renderPoll();
    startRefresh();
    window.scrollTo(0, 0);
  }
  function savePoll(btn) {
    if (draftCheck().err) return;
    return runAction(btn, 'Enregistrement…', async () => {
      const st = await api('PUT', '/polls/' + poll.st.i, draftPayload());
      poll.st = st;
      remember(st);
      ui = freshUi();
      leaveEdit();
      showToast('Sondage modifié.');
    });
  }

  async function createPoll(btn) {
    const chk = draftCheck();
    if (chk.err || busy) return;
    busy = true;
    btn.disabled = true;
    btn.textContent = 'Création…';
    try {
      const st = await api('POST', '/polls', draftPayload());
      busy = false;
      remember(st);
      poll = { st, example: false };
      ui = freshUi();
      ui.created = true;
      view = 'poll';
      lastRoute = st.i;
      location.hash = st.i;
      renderPoll();
      startRefresh();
      window.scrollTo(0, 0);
    } catch (err) {
      busy = false;
      const box = $('#c-error');
      if (box) { box.hidden = false; box.textContent = err.message; }
      btn.disabled = false;
      btn.textContent = 'Créer le sondage';
    }
  }

  /* ---------- Vue : sondage ---------- */
  async function loadPoll(id) {
    view = 'loading';
    app.innerHTML = '<p class="loading">Ouverture du sondage…</p>';
    try {
      const st = await api('GET', '/polls/' + id);
      if (lastRoute !== id) return;
      openPoll(st);
    } catch (err) {
      if (lastRoute !== id) return;
      if (err.status === 404) { showCreate(err.message); return; }
      if (err.pin) { showPin(id); return; }
      view = 'error';
      app.innerHTML = `<section class="state"><h1>On mange quand&nbsp;?</h1><p class="error" role="alert">${esc(err.message)}</p><button type="button" class="btn primary" data-act="retry" data-id="${esc(id)}">Réessayer</button></section>`;
    }
  }

  // Affiche un sondage reçu du serveur. Une réponse en cours sur ce même sondage est gardée si ses créneaux n'ont pas changé.
  function openPoll(st) {
    remember(st);
    const same = poll && !poll.example && poll.st.i === st.i && slotsKeyOf(poll.st) === slotsKeyOf(st);
    poll = { st, example: false };
    if (!same) ui = freshUi();
    view = 'poll';
    renderPoll();
    startRefresh();
  }

  /* ---------- Vue : code d'accès ---------- */
  // Le sondage en cours et la réponse commencée restent en mémoire : ils reviennent une fois le bon code donné.
  function showPin(id, msg) {
    view = 'pin';
    pinFor = id;
    stopRefresh();
    app.innerHTML = `
      <header class="poll-head">
        <a class="back" href="#nouveau">← Nouveau sondage</a>
        <h1>Sondage protégé</h1>
        <p class="lede">L’organisateur a protégé ce sondage par un code. Entrez-le pour voir les dispos et ajouter les vôtres.</p>
      </header>
      <section class="card" aria-labelledby="pin-h">
        <h2 id="pin-h">Code d’accès</h2>
        <form class="auth-form" id="pin-form" novalidate>
          <input type="text" id="pin-input" class="code-input big" inputmode="numeric" maxlength="6" autocomplete="off" spellcheck="false" aria-labelledby="pin-h" aria-describedby="pin-error">
          <p class="error" id="pin-error" role="alert"${msg ? '' : ' hidden'}>${esc(msg || '')}</p>
          <button type="submit" class="btn primary big" id="pin-submit">Ouvrir le sondage</button>
        </form>
        <p class="hint">Pas de code&nbsp;? Demandez-le à l’organisateur.${auth.enabled && !auth.user
          ? ' C’est vous&nbsp;? <a href="#compte">Connectez-vous</a> pour l’ouvrir sans code.' : ''}</p>
      </section>`;
    $('#pin-input').focus();
  }
  function submitPin() {
    const id = pinFor;
    const input = $('#pin-input');
    const box = $('#pin-error');
    const pin = input.value.trim();
    if (!/^\d{4,6}$/.test(pin)) {
      box.hidden = false;
      box.textContent = 'Le code fait 4 à 6 chiffres.';
      input.focus();
      return;
    }
    box.hidden = true;
    return runAction($('#pin-submit'), 'Vérification…', async () => {
      let st;
      try {
        st = await api('POST', '/polls/' + id + '/pin', { pin });
      } catch (e) {
        if (!box.isConnected) throw e;
        box.hidden = false;
        box.textContent = e.message;
        input.select();
        const quiet = new Error(e.message);
        quiet.silent = true; // déjà affiché sous le champ
        throw quiet;
      }
      if (lastRoute !== id) return;
      openPoll(st);
      window.scrollTo(0, 0);
    });
  }

  function pollLink() { return location.origin + location.pathname + '#' + poll.st.i; }

  function ctx() {
    const st = poll.st;
    const slots = buildSlots(st);
    poll.slots = slots;
    const people = st.p;
    return { st, slots, people, stats: computeStats(slots, people) };
  }
  function metaText(c) {
    const s = parseYmd(c.st.s), e = parseYmd(c.st.e);
    const dl = daysLabel(c.st.m);
    const added = (c.st.a || []).length;
    return [
      `Du ${fmt(fShort, s)} au ${fmt(fShort, e)}`,
      momentsUsed(c.st.m).join(', ') + (dl ? ' · ' + dl : '') + (added ? ` + ${plural(added, 'jour férié', 'jours fériés')}` : ''),
      plural(c.people.length, 'réponse'),
    ].join(' · ');
  }

  function renderPoll() {
    const c = ctx();
    const st = c.st;
    app.innerHTML = `
      <header class="poll-head">
        <a class="back" href="#nouveau">← Nouveau sondage</a>
        <h1>${esc(st.t || 'Repas')}</h1>
        ${st.n ? `<p class="note">${esc(st.n)}</p>` : ''}
        <p class="meta" id="meta">${esc(metaText(c))}</p>
        ${st.isOwner ? '<p class="org-badge">Vous êtes l’organisateur</p>' : ''}
        ${!poll.example && !st.owned ? '<p class="hint">Sondage sans organisateur&nbsp;: tout le monde peut modifier les réponses et choisir la date.</p>' : ''}
      </header>
      ${poll.example ? `<div class="banner"><p>Exemple avec des réponses fictives. Rien n’est enregistré.</p><a class="btn" href="#nouveau">Créer mon sondage</a></div>` : ''}
      ${st.closed ? `<div class="banner closed"><p>Sondage clôturé&nbsp;: les réponses ne peuvent plus changer${st.isOwner ? ', sauf par vous' : ''}.</p></div>` : ''}
      ${!poll.example && ui.created ? shareHTML() + ownerHTML() : ''}
      <div class="slot" id="verdict-slot">${verdictHTML(c)}</div>
      <div class="slot" id="answer-slot">${answerHTML(c)}</div>
      ${!poll.example && !ui.created ? shareHTML() : ''}
      <div class="slot" id="results-slot">${tableHTML(c)}</div>
      ${!poll.example && !ui.created ? ownerHTML() : ''}`;
  }

  // Mise à jour discrète quand d'autres personnes ont répondu : on ne touche pas au formulaire ouvert.
  function renderLive() {
    const c = ctx();
    const meta = $('#meta');
    if (!meta) return renderPoll();
    meta.textContent = metaText(c);
    $('#verdict-slot').innerHTML = verdictHTML(c);
    $('#results-slot').innerHTML = tableHTML(c);
    if (!ui.open) $('#answer-slot').innerHTML = answerHTML(c);
  }

  function finalIndex(slots) {
    const f = poll.st.f;
    return Number.isInteger(f) && f >= 0 && f < slots.length ? f : -1;
  }
  function whoList(i, people) {
    const y = [], m = [], n = [];
    for (const p of people) { const ch = p[1][i]; (ch === '1' ? y : ch === '2' ? m : n).push(p[0]); }
    return `<ul class="who">${y.map((x) => `<li class="y">✓ ${esc(x)}</li>`).join('')}${m.map((x) => `<li class="m">~ ${esc(x)}</li>`).join('')}${n.map((x) => `<li class="n">${esc(x)}</li>`).join('')}</ul>`;
  }
  function scoreLine(r, n) {
    return `<p class="v-score"><b>${r.tot}</b> sur ${n} ${n > 1 ? 'personnes' : 'personne'} ${r.tot > 1 ? 'disponibles' : 'disponible'}${r.mb ? ` (dont ${r.mb} si besoin)` : ''}</p>`;
  }
  function verdictHTML(c) {
    const { slots, people, stats } = c;
    const n = people.length;
    const wrap = (label, title, body) => `<section class="verdict"><p class="v-label">${label}</p><p class="v-title">${title}</p>${body}</section>`;
    if (!n) return wrap('Meilleur créneau', 'Pas encore de réponse', `<p class="v-sub">${plural(slots.length, 'créneau proposé', 'créneaux proposés')}. Le meilleur s’affichera ici dès les premières réponses.</p>`);
    const f = finalIndex(slots);
    if (f >= 0) {
      return wrap('C’est décidé', esc(slotLong(slots[f])),
        scoreLine(stats[f], n) + whoList(f, people) + agendaHTML(slots[f]) +
        (canDecide() ? `<div class="v-actions"><button type="button" class="btn chalk-ghost" data-act="unfinal">Changer de créneau</button></div>` : ''));
    }
    const ranked = rank(stats);
    const best = ranked[0];
    if (best.tot === 0) return wrap('Meilleur créneau', 'Aucun créneau commun pour l’instant', `<p class="v-sub">Personne n’a encore coché de dispo.</p>`);
    const ties = ranked.filter((r) => r.tot === best.tot && r.y === best.y);
    const more = ranked.filter((r) => r.tot > 0 && !ties.includes(r)).slice(0, 3);
    const label = ties.length > 1 ? `Égalité entre ${ties.length} créneaux` : (best.tot === n && !best.mb ? 'Tout le monde est dispo' : 'Meilleur créneau');
    let body = scoreLine(best, n) + whoList(best.i, people);
    const decide = canDecide();
    body += decide
      ? `<div class="v-actions"><button type="button" class="btn chalk" data-act="final" data-i="${best.i}">Choisir ce créneau</button></div>`
      : '<p class="v-more">L’organisateur choisira la date finale.</p>';
    if (ties.length > 1) {
      body += `<div class="ties">Aussi à égalité&nbsp;: ${ties.slice(1, 6).map((r) => (decide
        ? `<button type="button" class="tie" data-act="final" data-i="${r.i}" title="Choisir ce créneau">${esc(slotShort(slots[r.i]))}</button>`
        : `<span>${esc(slotShort(slots[r.i]))}</span>`)).join(decide ? '' : ' · ')}</div>`;
    }
    if (more.length) body += `<p class="v-more">Ensuite&nbsp;: ${more.map((r) => `${esc(slotShort(slots[r.i]))} (${r.tot}/${n})`).join(' · ')}</p>`;
    return wrap(label, esc(slotLong(slots[best.i])), body);
  }

  function answerCountText() {
    let y = 0, m = 0;
    for (const v of ui.vals) { if (v === 1) y++; else if (v === 2) m++; }
    return `${y} dispo · ${m} si besoin`;
  }
  function nameHint(name) {
    const k = norm(name);
    if (!k) return '';
    if (ui.editing && norm(ui.editing) === k) return `Vous modifiez la réponse de ${ui.editing}.`;
    const ex = poll.st.p.find((p) => norm(p[0]) === k);
    if (ex && ex[4] === false) return `${ex[0]} a répondu avec son compte : choisissez un autre prénom (ex. « ${name.trim()} B. »).`;
    if (ex) return `${ex[0]} a déjà répondu : cette réponse remplacera la sienne.`;
    if (ui.editing) return `La réponse de ${ui.editing} sera renommée « ${name.trim()} ».`;
    return '';
  }
  function slotAria(sl, v, i) {
    const c = conflictOf(i);
    return `${fmt(fLong, sl.d)}, ${MOMENTS[sl.t].toLowerCase()} : ${STATE_LABEL[v]}${c ? ` (déjà pris : ${c})` : ''}`;
  }
  const slotClass = (i, v) => 'sbtn s' + v + (conflictOf(i) ? ' busy' : '');
  const slotLabelHTML = (i) => {
    const c = conflictOf(i);
    return MOMENTS[poll.slots[i].t] + (c ? `<small class="bz">${esc(c)}</small>` : '');
  };

  /* ---------- Créneaux déjà pris : agenda Google et autres repas du compte ---------- */
  // Heure de Paris → instant, sans bibliothèque : on mesure le décalage de Paris à cet instant (heure d'été comprise).
  const parisParts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Paris', hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  function parisOffset(ms) {
    const p = {};
    for (const x of parisParts.formatToParts(new Date(ms))) p[x.type] = +x.value;
    return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute) - Math.floor(ms / 60000) * 60000;
  }
  function parisTime(d, hhmm) {
    const local = d * DAY_MS + (+hhmm.slice(0, 2)) * 3600000 + (+hhmm.slice(2)) * 60000;
    return local - parisOffset(local - parisOffset(local)); // deux passes : justes aussi autour des changements d'heure
  }
  const fParisHm = new Intl.DateTimeFormat('fr-FR', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const parisHm = (ms) => fParisHm.format(new Date(ms)).replace(/\D/g, '');
  // Plage comparée à l'agenda : les horaires indicatifs du moment, ou 8 h – 23 h pour « Journée ».
  function slotRange(sl) {
    const h = MOMENT_HOURS[sl.t] || ['0800', '2300'];
    return [parisTime(sl.d, h[0]), parisTime(sl.d, h[1])];
  }
  // « pris 20 h – 22 h 30 » si une plage occupée chevauche le créneau, sinon ''.
  function busyLabel(sl, range, busy) {
    const dayStart = parisTime(sl.d, '0000'), dayEnd = parisTime(sl.d + 1, '0000');
    const hits = busy.filter(([s, e]) => s < range[1] && e > range[0]).map(([s, e]) => {
      const a = Math.max(s, dayStart), b = Math.min(e, dayEnd);
      if (a === dayStart && b === dayEnd) return 'toute la journée';
      return `${hourLabel(parisHm(a))} – ${b === dayEnd ? 'minuit' : hourLabel(parisHm(b))}`;
    });
    if (!hits.length) return '';
    return 'pris ' + (hits.includes('toute la journée') ? 'toute la journée' : hits.slice(0, 2).join(', ') + (hits.length > 2 ? '…' : ''));
  }

  // Comparaison avec l'agenda Google : client OAuth public du projet Firebase (vide = bouton masqué).
  // Google ne renvoie que les plages occupées de l'agenda principal ; tout reste dans le navigateur.
  // Côté Google Cloud : API Google Calendar activée, adresse du site dans les origines JavaScript autorisées du client.
  const GOOGLE_CLIENT_ID = '704019232045-j9fb3sh6q6llg1ecm7qjrno34fecr7mb.apps.googleusercontent.com';
  const FREEBUSY_SCOPE = 'https://www.googleapis.com/auth/calendar.freebusy';
  let gisLoading = null;
  // Le script de Google se charge à l'ouverture du formulaire : la fenêtre d'accord doit s'ouvrir dès le toucher du bouton.
  function loadGis() {
    if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
    if (!gisLoading) {
      gisLoading = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://accounts.google.com/gsi/client';
        s.async = true;
        s.onload = () => resolve();
        s.onerror = () => { gisLoading = null; s.remove(); reject(new Error('Impossible de joindre Google. Vérifiez votre réseau et réessayez.')); };
        document.head.appendChild(s);
      });
    }
    return gisLoading;
  }
  function googleToken() {
    return new Promise((resolve, reject) => {
      const fail = (msg, silent) => { const e = new Error(msg); e.silent = !!silent; reject(e); };
      google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: FREEBUSY_SCOPE,
        login_hint: (auth.user && auth.user.email) || undefined,
        callback: (r) => {
          if (r.error) return fail(r.error === 'access_denied' ? 'Accès refusé : rien n’a été lu dans votre agenda.' : 'Google n’a pas donné accès à votre agenda. Réessayez.');
          if (!google.accounts.oauth2.hasGrantedAllScopes(r, FREEBUSY_SCOPE)) return fail('Autorisez l’accès à vos disponibilités pour comparer avec votre agenda.');
          resolve(r.access_token);
        },
        error_callback: (e) => (e && e.type === 'popup_failed_to_open'
          ? fail('La fenêtre Google a été bloquée. Autorisez les fenêtres pop-up pour ce site, puis réessayez.')
          : fail('Fenêtre Google fermée : rien n’a été lu.', true)),
      }).requestAccessToken();
    });
  }
  async function fetchBusy(token, from, to) {
    const busy = [];
    // Par tranches de 30 jours, pour rester dans ce que Google accepte en une requête.
    for (let a = from; a < to; a += 30 * DAY_MS) {
      let res, data = null;
      try {
        res = await fetch('https://www.googleapis.com/calendar/v3/freeBusy', {
          method: 'POST',
          headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' },
          body: JSON.stringify({ timeMin: new Date(a).toISOString(), timeMax: new Date(Math.min(to, a + 30 * DAY_MS)).toISOString(), items: [{ id: 'primary' }] }),
        });
        data = await res.json();
      } catch (e) {
        if (!res) throw new Error('Impossible de joindre Google Agenda. Vérifiez votre réseau et réessayez.');
      }
      const cal = data && data.calendars && data.calendars.primary;
      if (!res.ok || !cal || cal.errors) throw new Error('Google Agenda n’a pas répondu. Réessayez dans un instant.');
      for (const b of cal.busy || []) busy.push([Date.parse(b.start), Date.parse(b.end)]);
    }
    return busy;
  }

  // Conflits connus pour la réponse en cours ; on les oublie si on change de sondage ou si ses créneaux changent.
  let agenda = { key: '', google: null, polls: null };
  const agendaKey = () => (poll ? poll.st.i + '|' + slotsKeyOf(poll.st) : '');
  function agendaNow() {
    if (agenda.key !== agendaKey()) agenda = { key: agendaKey(), google: null, polls: null };
    return agenda;
  }
  function conflictOf(i) {
    if (i == null || !poll) return '';
    const a = agendaNow();
    return [a.google && a.google.get(i), a.polls && a.polls.get(i)].filter(Boolean).join(' · ');
  }
  function agendaToolsHTML() {
    const a = agendaNow();
    const total = poll.slots.length;
    let n = 0;
    for (let i = 0; i < total; i++) if (conflictOf(i)) n++;
    const out = [];
    if (GOOGLE_CLIENT_ID && !a.google) {
      out.push(`<button type="button" class="mini gcal" data-act="agenda-google">${GOOGLE_ICON.replace(/18/g, '15')}Comparer avec mon agenda Google</button>`);
    }
    if (a.google) {
      out.push(`<span>${n ? `${plural(n, 'créneau', 'créneaux')} déjà pris dans votre agenda${a.polls && a.polls.size ? ' ou vos autres repas' : ''}.` : 'Votre agenda est libre sur tous ces créneaux.'}</span>`);
    } else if (n) {
      out.push(`<span>${plural(n, 'créneau', 'créneaux')} en conflit avec vos autres repas.</span>`);
    }
    if ((a.google || n) && n < total) out.push(`<button type="button" class="mini" data-act="fill-free">Cocher les ${plural(total - n, 'créneau libre', 'créneaux libres')}</button>`);
    if (GOOGLE_CLIENT_ID && !a.google) out.push('<span class="hint">Google ne transmet que vos plages occupées, rien n’est enregistré.</span>');
    return out.join('');
  }
  // Met à jour les repères sans reconstruire le formulaire (on ne perd ni le focus ni la saisie).
  function paintAgenda() {
    if (!ui.open || !poll || !poll.slots) return;
    app.querySelectorAll('.sbtn').forEach((el) => {
      const i = +el.dataset.i, v = ui.vals[i] || 0;
      el.className = slotClass(i, v);
      el.querySelector('.sl').innerHTML = slotLabelHTML(i);
      el.setAttribute('aria-label', slotAria(poll.slots[i], v, i));
    });
    const box = $('#ans-agenda');
    if (box) box.innerHTML = agendaToolsHTML();
  }
  function compareGoogle(btn) {
    const key = agendaKey();
    const slots = poll.slots;
    return runAction(btn, 'Lecture de l’agenda…', async () => {
      // Script déjà prêt : la fenêtre s'ouvre dans le geste même, sinon les navigateurs la bloquent.
      const ready = window.google && google.accounts && google.accounts.oauth2;
      const token = await (ready ? googleToken() : loadGis().then(googleToken));
      const ranges = slots.map(slotRange);
      const busy = await fetchBusy(token, Math.min(...ranges.map((r) => r[0])), Math.max(...ranges.map((r) => r[1])));
      if (agendaKey() !== key || !ui.open) return;
      const found = new Map();
      slots.forEach((sl, i) => { const label = busyLabel(sl, ranges[i], busy); if (label) found.set(i, label); });
      agendaNow().google = found;
      paintAgenda();
      showToast(found.size ? `${plural(found.size, 'créneau', 'créneaux')} déjà pris dans votre agenda.` : 'Rien dans votre agenda sur ces créneaux.');
    });
  }
  // Repas déjà décidés dans les autres sondages du compte, au même moment : aucun accès à l'agenda nécessaire.
  async function loadPollConflicts() {
    if (!auth.user || !poll || poll.example) return;
    const key = agendaKey();
    try {
      const { polls } = await api('GET', '/me/polls');
      if (agendaKey() !== key || !ui.open) return;
      const overlap = (a, b) => { const ha = MOMENT_HOURS[a], hb = MOMENT_HOURS[b]; return !ha || !hb || (ha[0] < hb[1] && hb[0] < ha[1]); };
      const found = new Map();
      for (const p of polls) {
        if (p.i === poll.st.i || !p.fd) continue;
        const d = parseYmd(p.fd);
        poll.slots.forEach((sl, i) => {
          if (sl.d === d && overlap(sl.t, p.ft)) found.set(i, (found.has(i) ? found.get(i) + ', ' : '') + `« ${p.t} »`);
        });
      }
      agendaNow().polls = found;
      paintAgenda();
    } catch (e) { /* facultatif : sans cette information, le formulaire marche pareil */ }
  }
  function setVals(fn) {
    ui.vals = poll.slots.map((_, i) => fn(i));
    app.querySelectorAll('.sbtn').forEach((el) => {
      const i = +el.dataset.i, v = ui.vals[i];

  function tableHTML(c) {

  /* ---------- Actions ---------- */
  // Applique une modification : sur le serveur, ou en mémoire pour l'exemple.
  async function mutate(kind, payload) {
    if (poll.example) { poll.st = applyLocal(poll.st, kind, payload); return; }
    const id = poll.st.i;
    const path = '/polls/' + id + (kind === 'final' ? '/final' : '/answers');
    // Pour une réponse, la page joint la liste des créneaux qu'elle connaît : le serveur refuse si elle est périmée.
    const body = kind === 'save' ? Object.assign({ slotsKey: slotsKeyOf(poll.st) }, payload) : payload;
    const st = await api(kind === 'delete' ? 'DELETE' : 'PUT', path, body);
    if (poll && poll.st.i === id) { poll.st = st; remember(st); }
  }
  function applyLocal(st, kind, pl) {
    const out = Object.assign({}, st, { p: st.p.slice() });
    if (kind === 'final') { out.f = pl.i; return out; }
    if (kind === 'delete') { out.p = out.p.filter((p) => norm(p[0]) !== norm(pl.name)); return out; }
    const key = norm(pl.name);
    if (pl.prev && norm(pl.prev) !== key) out.p = out.p.filter((p) => norm(p[0]) !== norm(pl.prev));
    const entry = [pl.name, pl.ans, Date.now(), pl.note || ''];
    const idx = out.p.findIndex((p) => norm(p[0]) === key);
    if (idx >= 0) out.p[idx] = entry; else out.p.push(entry);
    return out;
  }

  async function runAction(btn, label, fn) {
    if (busy) return;
    busy = true;
    const old = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = label; }
    try {
      await fn();
    } catch (err) {
      // Le code a été ajouté ou changé pendant qu'on avait le sondage ouvert : on le demande, la réponse en cours est gardée.
      if (err.pin && view === 'poll' && poll && !poll.example) { showPin(poll.st.i, 'Le code d’accès a changé : entrez le nouveau code pour continuer.'); return; }
      if (!err.silent) showToast(err.message, true);
      if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = old; }
    } finally {
      busy = false;
    }
  }

  function saveAnswer(btn) {
    const name = ui.name.trim().replace(/\s+/g, ' ');
    const hint = $('#ans-hint');
    if (!name) {
      hint.textContent = 'Indiquez votre prénom pour enregistrer.';
      hint.classList.add('error');
      $('#ans-name').focus();
      return;
    }
    const clash = poll.st.p.find((p) => norm(p[0]) === norm(name) && p[4] === false);
    if (clash) {
      hint.textContent = nameHint(name);
      hint.classList.add('error');
      $('#ans-name').focus();
      return;
    }
    return runAction(btn, 'Enregistrement…', async () => {
      await mutate('save', { name, ans: ui.vals.join(''), note: ui.note.trim().replace(/\s+/g, ' '), prev: ui.editing });
      if (!poll.example) remember(poll.st, name);
      const created = ui.created;
      ui = freshUi();
      ui.created = created;
      ui.savedName = name;
      renderPoll();
      scrollToId('verdict-slot');
    });
  }

  function deleteAnswer(btn) {

      await mutate('delete', { name });

      renderPoll();
      showToast(`Réponse de ${name} supprimée.`);

  function setFinal(btn, i) {

  /* ---------- Exemple ---------- */
  function exampleState() {
    const s = todayDay + 6, e = s + 20;
    const st = { i: 'exemple', t: 'Raclette de décembre', n: 'Chez Léa · chacun apporte un fromage', s: ymd(s, ''), e: ymd(e, ''), m: [0, 0, 0, 0, 16, 20, 4], x: [], p: [], f: -1 };
    const slots = buildSlots(st);
    const names = ['Léa', 'Karim', 'Sophie', 'Hugo', 'Inès'];
    let seed = 11;
    const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
    const grid = names.map(() => slots.map(() => { const r = rnd(); return r < 0.45 ? '1' : r < 0.6 ? '2' : '0'; }));
    const star = Math.min(slots.length - 1, Math.floor(slots.length * 0.6));
    slots.forEach((_, i) => {
      if (i === star) { names.forEach((_, k) => { grid[k][i] = k === 3 ? '2' : '1'; }); return; }
      if (names.every((_, k) => grid[k][i] !== '0')) grid[i % names.length][i] = '0';
    });
    const notes = ['', 'Je peux apporter la machine à raclette', '', 'Dispo seulement après 20 h', ''];
    st.p = names.map((nm, k) => [nm, grid[k].join(''), k, notes[k]]);
    return st;
  }

  function focusSelector(el) {
    let sel = `[data-act="${el.dataset.act}"]`;
