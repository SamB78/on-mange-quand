<body>
<div class="band" aria-hidden="true"></div>
<main class="wrap" id="app"><p class="loading">Chargement…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';

  const STORE_KEY = 'on-mange-quand:v2';
  const DAY_MS = 86400000;
  const MAX_DAYS = 92, MAX_SLOTS = 200;
  const REFRESH_MS = 15000;
  const ID_RE = /^[a-z2-7]{10}$/;

  // L'ordre compte : il fixe l'ordre des créneaux dans une journée (même règle que le serveur).
  const MOMENTS = ['Journée', 'Matin', 'Midi', 'Après-midi', 'Soir'];
  const SOIR = 1 << 4;
  const WD = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
  const WD_LONG = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
  const STATE_LABEL = ['pas dispo', 'dispo', 'si besoin'];

  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');
  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const $ = (sel) => app.querySelector(sel);

  /* ---------- Outils ---------- */
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = (s) => String(s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
  const plural = (n, one, many) => n + ' ' + (n > 1 ? (many || one + 's') : one);
  const popcount = (r) => (r & 1) + ((r >> 1) & 1) + ((r >> 2) & 1) + ((r >> 3) & 1) + ((r >> 4) & 1);

  const todayDay = (() => { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / DAY_MS; })();
  function parseYmd(s) {
    const c = String(s || '').replace(/-/g, '');
    if (!/^\d{8}$/.test(c)) return NaN;
    return Date.UTC(+c.slice(0, 4), +c.slice(4, 6) - 1, +c.slice(6, 8)) / DAY_MS;
  }
  function ymd(d, sep) {
    const t = new Date(d * DAY_MS);
    return [t.getUTCFullYear(), String(t.getUTCMonth() + 1).padStart(2, '0'), String(t.getUTCDate()).padStart(2, '0')].join(sep == null ? '-' : sep);
  }
  const weekday = (d) => (new Date(d * DAY_MS).getUTCDay() + 6) % 7;
  const dateOf = (d) => new Date(d * DAY_MS).getUTCDate();
  const monthKey = (d) => { const t = new Date(d * DAY_MS); return t.getUTCFullYear() * 12 + t.getUTCMonth(); };
  const F = (o) => new Intl.DateTimeFormat('fr-FR', Object.assign({ timeZone: 'UTC' }, o));
  const fShort = F({ weekday: 'short', day: 'numeric', month: 'short' });
  const fLong = F({ weekday: 'long', day: 'numeric', month: 'long' });
  const fMonth = F({ month: 'long', year: 'numeric' });
  const fDM = F({ day: 'numeric', month: 'short' });
  const fWd = F({ weekday: 'short' });
  const fmt = (f, d) => f.format(new Date(d * DAY_MS));
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  let toastTimer = null;
  function showToast(msg, isError) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('err', !!isError);
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.hidden = true; }, isError ? 5000 : 3000);
  }

  /* ---------- Serveur ---------- */
  async function api(method, path, body) {
    let res;
    try {
      res = await fetch('/api' + path, {
        method,
        headers: body ? { 'content-type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined,
        cache: 'no-store',
      });
    } catch (e) {
      const err = new Error('Connexion impossible. Vérifiez votre réseau et réessayez.');
      err.status = 0;
      throw err;
    }
    let data = null;
    try { data = await res.json(); } catch (e) { /* réponse vide */ }
    if (!res.ok) {
      const err = new Error((data && data.error) || 'Le serveur a rencontré un problème. Réessayez dans un instant.');
      err.status = res.status;
      throw err;
    }
    return data;
  }

  /* ---------- Créneaux ---------- */
  function buildSlots(st) {
    const s = parseYmd(st.s), e = parseYmd(st.e);
    const ex = new Set(st.x.map((o) => s + o));
    const slots = [];
    for (let d = s; d <= e; d++) {
      if (ex.has(d)) continue;
      const r = st.m[weekday(d)];
      for (let t = 0; t < MOMENTS.length; t++) if (r & (1 << t)) slots.push({ d, t });
    }
    return slots;
  }
  function computeStats(slots, people) {
    return slots.map((sl, i) => {
      let y = 0, mb = 0;
      for (const p of people) { const c = p[1][i]; if (c === '1') y++; else if (c === '2') mb++; }
      return { i, y, mb, tot: y + mb };
    });
  }
  const rank = (stats) => stats.slice().sort((a, b) => b.tot - a.tot || b.y - a.y || a.i - b.i);
  const slotLong = (sl) => cap(fmt(fLong, sl.d)) + ' · ' + MOMENTS[sl.t];
  const slotShort = (sl) => fmt(fShort, sl.d) + ' · ' + MOMENTS[sl.t].toLowerCase();
  function momentsUsed(m) {
    const u = m.reduce((a, r) => a | r, 0);
    return MOMENTS.filter((_, t) => u & (1 << t));
  }
  function daysLabel(m) {
    const key = m.map((r) => (r ? 1 : 0)).join('');
    if (key === '1111111') return '';
    if (key === '1111100') return 'en semaine';
    if (key === '0000011') return 'le week-end';
    return WD.filter((_, w) => m[w]).map((s) => s.toLowerCase()).join(', ');
  }

  /* ---------- Mémoire locale : vos sondages et votre prénom, sur cet appareil ---------- */
  function loadStore() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (s && typeof s === 'object' && s.polls && typeof s.polls === 'object') return s;
    } catch (e) { /* stockage indisponible */ }
    return { polls: {} };
  }
  function saveStore(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { /* ignoré */ } }
  function remember(st, me) {
    const s = loadStore();
    const prev = s.polls[st.i] || {};
    s.polls[st.i] = { t: st.t, s: st.s, e: st.e, n: st.p.length, seen: Date.now(), me: me !== undefined ? me : (prev.me || null) };
    Object.keys(s.polls).sort((a, b) => s.polls[b].seen - s.polls[a].seen).slice(30).forEach((id) => delete s.polls[id]);
    saveStore(s);
  }
  function getMe() {
    if (!poll || poll.example) return null;
    const p = loadStore().polls[poll.st.i];
    return (p && p.me) || null;
  }

  /* ---------- État ---------- */
  let view = null;      // 'create' | 'poll' | 'loading' | 'error'
  let lastRoute = null;
  let poll = null;      // { st, example, slots }
  let ui = freshUi();
  let busy = false;
  let refreshTimer = null;
  function freshUi() { return { open: false, name: '', vals: [], editing: null, delAsk: false, savedName: '', created: false }; }

  const draft = {
    t: '', n: '',
    s: todayDay + 1, e: todayDay + 28,
    m: [SOIR, SOIR, SOIR, SOIR, SOIR, SOIR, SOIR],
    x: new Set(),
  };

  /* ---------- Vue : création ---------- */
  function showCreate(msg) {
    view = 'create';
    poll = null;
    stopRefresh();
    const mine = Object.entries(loadStore().polls)
      .map(([id, p]) => Object.assign({ id }, p))
      .filter((p) => ID_RE.test(p.id))
      .sort((a, b) => b.seen - a.seen)
      .slice(0, 8);
    app.innerHTML = `
      <header class="hero">
        <p class="eyebrow">Sondage de dispos · sans compte</p>
        <h1>On mange quand&nbsp;?</h1>
        <p class="lede">Choisissez la période et les moments possibles, envoyez le lien au groupe&nbsp;: chacun coche ses dispos et le meilleur créneau ressort tout seul.</p>
        <p class="hero-links"><a class="btn" href="#exemple">Voir un exemple</a></p>
      </header>
      ${msg ? `<p class="error" role="alert">${esc(msg)}</p>` : ''}
      ${mine.length ? `<section class="mine"><h2>Vos sondages</h2><ul>${mine.map((p) =>
        `<li><a href="#${esc(p.id)}"><span class="mt">${esc(p.t || 'Repas')}</span><span class="ms">${fmt(fDM, parseYmd(p.s))} → ${fmt(fDM, parseYmd(p.e))} · ${plural(p.n || 0, 'réponse')}</span></a></li>`).join('')}</ul></section>` : ''}
      <section class="card" aria-labelledby="c-h">
        <h2 id="c-h">Nouveau sondage</h2>
        <div class="field"><label for="c-title">Nom du repas</label><input type="text" id="c-title" maxlength="80" placeholder="Raclette de janvier" autocomplete="off"></div>
        <div class="field"><label for="c-note">Précisions <span class="opt">(facultatif)</span></label><input type="text" id="c-note" maxlength="160" placeholder="Chez Julie, chacun apporte un plat" autocomplete="off"></div>
        <fieldset class="field"><legend>Période</legend>
          <div class="dates">
            <label for="c-start">Du<input type="date" id="c-start"></label>
            <label for="c-end">Au<input type="date" id="c-end"></label>
          </div>
        </fieldset>
        <fieldset class="field"><legend>Moments possibles</legend><div class="chips" id="c-moments"></div></fieldset>
        <fieldset class="field"><legend>Jours possibles</legend>
          <div class="chips days" id="c-days"></div>
          <div class="presets">Raccourcis&nbsp;:
            <button type="button" class="mini" data-act="preset" data-p="all">Tous les jours</button>
            <button type="button" class="mini" data-act="preset" data-p="week">En semaine</button>
            <button type="button" class="mini" data-act="preset" data-p="weekend">Week-end</button>
          </div>
        </fieldset>
        <details id="c-fine">
          <summary>Ajuster jour par jour</summary>
          <div class="fine-body">
            <p class="hint">Par exemple&nbsp;: le soir en semaine, midi et soir le week-end.</p>
            <div class="matrix-scroll"><table class="matrix" id="c-matrix"></table></div>
          </div>
        </details>
        <div class="field">
          <div class="preview-head"><span class="label">Aperçu</span><span class="count" id="c-count"></span></div>
          <p class="hint">Touchez un jour pour l’exclure (anniversaire, week-end déjà pris…).</p>
          <div class="cal" id="c-cal"></div>
        </div>
        <p class="error" id="c-error" role="alert" hidden></p>
        <button type="button" class="btn primary big" id="c-create" data-act="create">Créer le sondage</button>
      </section>`;
    $('#c-title').value = draft.t;
    $('#c-note').value = draft.n;
    $('#c-start').value = Number.isFinite(draft.s) ? ymd(draft.s) : '';
    $('#c-start').min = ymd(todayDay);
    $('#c-end').value = Number.isFinite(draft.e) ? ymd(draft.e) : '';
    renderCreateDynamic();
  }

  function draftCheck() {
    const { s, e } = draft;
    if (!Number.isFinite(s) || !Number.isFinite(e)) return { err: 'Choisissez une date de début et une date de fin.' };
    if (e < s) return { err: 'La date de fin doit être après la date de début.' };
    if (e - s >= MAX_DAYS) return { err: 'Période trop longue : 3 mois maximum.' };
    let slots = 0, days = 0;
    for (let d = s; d <= e; d++) {
      const r = draft.m[weekday(d)];
      if (!r || draft.x.has(d)) continue;
      days++; slots += popcount(r);
    }
    if (!slots) return { err: 'Aucun créneau : choisissez au moins un jour et un moment.', slots, days };
    if (slots > MAX_SLOTS) return { err: `Trop de créneaux (${slots}). Réduisez la période ou le nombre de moments (${MAX_SLOTS} maximum).`, slots, days };
    return { slots, days };
  }

  function renderCreateDynamic() {
    const union = draft.m.reduce((a, r) => a | r, 0);
    $('#c-moments').innerHTML = MOMENTS.map((label, t) =>
      `<button type="button" class="chip" data-act="moment" data-t="${t}" aria-pressed="${!!(union & (1 << t))}">${label}</button>`).join('');
    $('#c-days').innerHTML = WD.map((d, w) =>
      `<button type="button" class="chip" data-act="day" data-w="${w}" aria-pressed="${draft.m[w] !== 0}" aria-label="${WD_LONG[w]}">${d}</button>`).join('');
    $('#c-matrix').innerHTML =
      `<thead><tr><td></td>${WD.map((d) => `<th scope="col">${d}</th>`).join('')}</tr></thead><tbody>` +
      MOMENTS.map((label, t) => `<tr><th scope="row">${label}</th>${WD.map((d, w) =>
        `<td><button type="button" class="mcell" data-act="cell" data-w="${w}" data-t="${t}" aria-pressed="${!!(draft.m[w] & (1 << t))}" aria-label="${label}, ${WD_LONG[w]}"></button></td>`).join('')}</tr>`).join('') +
      '</tbody>';

    const chk = draftCheck();
    const cal = $('#c-cal');
    const { s, e } = draft;
    if (Number.isFinite(s) && Number.isFinite(e) && e >= s && e - s < MAX_DAYS) {
      let html = ['lu', 'ma', 'me', 'je', 've', 'sa', 'di'].map((d) => `<span class="wh">${d}</span>`).join('');
      const gStart = s - weekday(s), gEnd = e + (6 - weekday(e));
      for (let w0 = gStart; w0 <= gEnd; w0 += 7) {
        let label = null;
        if (w0 === gStart) label = s;
        else for (let k = w0; k <= Math.min(w0 + 6, e); k++) if (dateOf(k) === 1) label = k;
        if (label !== null) html += `<span class="mh">${fmt(fMonth, label)}</span>`;
        for (let k = w0; k < w0 + 7; k++) {
          if (k < s || k > e) { html += '<span class="cd" aria-hidden="true"></span>'; continue; }
          const r = draft.m[weekday(k)];
          if (!r) { html += `<span class="cd off" aria-hidden="true">${dateOf(k)}</span>`; continue; }
          const ex = draft.x.has(k);
          html += `<button type="button" class="cd ${ex ? 'ex' : 'on'}" data-act="excl" data-d="${k}" aria-pressed="${!ex}" aria-label="${fmt(fLong, k)}${ex ? ', exclu' : ''}">${dateOf(k)}${ex ? '' : `<span class="dots">${'<i></i>'.repeat(popcount(r))}</span>`}</button>`;
        }
      }
      cal.innerHTML = html;
    } else {
      cal.innerHTML = '';
    }
    $('#c-count').textContent = chk.slots ? `${plural(chk.slots, 'créneau', 'créneaux')} sur ${plural(chk.days, 'jour')}` : '';
    const err = $('#c-error');
    err.hidden = !chk.err;
    err.textContent = chk.err || '';
    $('#c-create').disabled = !!chk.err || busy;
  }

  function toggleMoment(t) {
    const bit = 1 << t;
    const on = draft.m.some((r) => r & bit);
    if (on) { draft.m = draft.m.map((r) => r & ~bit); return; }
    const anyDay = draft.m.some((r) => r);
    draft.m = draft.m.map((r) => (anyDay ? (r ? r | bit : r) : bit));
  }
  function toggleDay(w) {
    if (draft.m[w]) { draft.m[w] = 0; return; }
    draft.m[w] = draft.m.reduce((a, r) => a | r, 0) || SOIR;
  }
  function preset(p) {
    const u = draft.m.reduce((a, r) => a | r, 0) || SOIR;
    draft.m = draft.m.map((_, w) => (p === 'all' || (p === 'week' && w < 5) || (p === 'weekend' && w >= 5)) ? u : 0);
  }

  async function createPoll(btn) {
    const chk = draftCheck();
    if (chk.err || busy) return;
    busy = true;
    btn.disabled = true;
    btn.textContent = 'Création…';
    try {
      const st = await api('POST', '/polls', {
        t: draft.t.trim(),
        n: draft.n.trim(),
        s: ymd(draft.s, ''), e: ymd(draft.e, ''),
        m: draft.m.slice(),
        x: Array.from(draft.x).filter((d) => d >= draft.s && d <= draft.e).map((d) => d - draft.s),
      });
      busy = false;
      remember(st);
      poll = { st, example: false };
      ui = freshUi();
      ui.created = true;
      view = 'poll';
      lastRoute = st.i;
      location.hash = st.i;
      renderPoll();
      startRefresh();
      window.scrollTo(0, 0);
    } catch (err) {
      busy = false;
      const box = $('#c-error');
      if (box) { box.hidden = false; box.textContent = err.message; }
      btn.disabled = false;
      btn.textContent = 'Créer le sondage';
    }
  }

  /* ---------- Vue : sondage ---------- */
  async function loadPoll(id) {
    view = 'loading';
    app.innerHTML = '<p class="loading">Ouverture du sondage…</p>';
    try {
      const st = await api('GET', '/polls/' + id);
      if (lastRoute !== id) return;
      remember(st);
      const same = poll && !poll.example && poll.st.i === id;
      poll = { st, example: false };
      if (!same) ui = freshUi();
      view = 'poll';
      renderPoll();
      startRefresh();
    } catch (err) {
      if (lastRoute !== id) return;
      if (err.status === 404) { showCreate(err.message); return; }
      view = 'error';
      app.innerHTML = `<section class="state"><h1>On mange quand&nbsp;?</h1><p class="error" role="alert">${esc(err.message)}</p><button type="button" class="btn primary" data-act="retry" data-id="${esc(id)}">Réessayer</button></section>`;
    }
  }

  function pollLink() { return location.origin + location.pathname + '#' + poll.st.i; }

  function ctx() {
    const st = poll.st;
    const slots = buildSlots(st);
    poll.slots = slots;
    const people = st.p;
    return { st, slots, people, stats: computeStats(slots, people) };
  }
  function metaText(c) {
    const s = parseYmd(c.st.s), e = parseYmd(c.st.e);
    const dl = daysLabel(c.st.m);
    return [
      `Du ${fmt(fShort, s)} au ${fmt(fShort, e)}`,
      momentsUsed(c.st.m).join(', ') + (dl ? ' · ' + dl : ''),
      plural(c.people.length, 'réponse'),
    ].join(' · ');
  }

  function renderPoll() {
    const c = ctx();
    const st = c.st;
    app.innerHTML = `
      <header class="poll-head">
        <a class="back" href="#nouveau">← Nouveau sondage</a>
        <h1>${esc(st.t || 'Repas')}</h1>
        ${st.n ? `<p class="note">${esc(st.n)}</p>` : ''}
        <p class="meta" id="meta">${esc(metaText(c))}</p>
      </header>
      ${poll.example ? `<div class="banner"><p>Exemple avec des réponses fictives. Rien n’est enregistré.</p><a class="btn" href="#nouveau">Créer mon sondage</a></div>` : ''}
      ${!poll.example && ui.created ? shareHTML() : ''}
      <div class="slot" id="verdict-slot">${verdictHTML(c)}</div>
      <div class="slot" id="answer-slot">${answerHTML(c)}</div>
      ${!poll.example && !ui.created ? shareHTML() : ''}
      <div class="slot" id="results-slot">${tableHTML(c)}</div>`;
  }

  // Mise à jour discrète quand d'autres personnes ont répondu : on ne touche pas au formulaire ouvert.
  function renderLive() {
    const c = ctx();
    const meta = $('#meta');
    if (!meta) return renderPoll();
    meta.textContent = metaText(c);
    $('#verdict-slot').innerHTML = verdictHTML(c);
    $('#results-slot').innerHTML = tableHTML(c);
    if (!ui.open) $('#answer-slot').innerHTML = answerHTML(c);
  }

  function finalIndex(slots) {
    const f = poll.st.f;
    return Number.isInteger(f) && f >= 0 && f < slots.length ? f : -1;
  }
  function whoList(i, people) {
    const y = [], m = [], n = [];
    for (const p of people) { const ch = p[1][i]; (ch === '1' ? y : ch === '2' ? m : n).push(p[0]); }
    return `<ul class="who">${y.map((x) => `<li class="y">✓ ${esc(x)}</li>`).join('')}${m.map((x) => `<li class="m">~ ${esc(x)}</li>`).join('')}${n.map((x) => `<li class="n">${esc(x)}</li>`).join('')}</ul>`;
  }
  function scoreLine(r, n) {
    return `<p class="v-score"><b>${r.tot}</b> sur ${n} ${n > 1 ? 'personnes' : 'personne'} ${r.tot > 1 ? 'disponibles' : 'disponible'}${r.mb ? ` (dont ${r.mb} si besoin)` : ''}</p>`;
  }
  function verdictHTML(c) {
    const { slots, people, stats } = c;
    const n = people.length;
    const wrap = (label, title, body) => `<section class="verdict"><p class="v-label">${label}</p><p class="v-title">${title}</p>${body}</section>`;
    if (!n) return wrap('Meilleur créneau', 'Pas encore de réponse', `<p class="v-sub">${plural(slots.length, 'créneau proposé', 'créneaux proposés')}. Le meilleur s’affichera ici dès les premières réponses.</p>`);
    const f = finalIndex(slots);
    if (f >= 0) {
      return wrap('C’est décidé', esc(slotLong(slots[f])),
        scoreLine(stats[f], n) + whoList(f, people) +
        `<div class="v-actions"><button type="button" class="btn chalk-ghost" data-act="unfinal">Changer de créneau</button></div>`);
    }
    const ranked = rank(stats);
    const best = ranked[0];
    if (best.tot === 0) return wrap('Meilleur créneau', 'Aucun créneau commun pour l’instant', `<p class="v-sub">Personne n’a encore coché de dispo.</p>`);
    const ties = ranked.filter((r) => r.tot === best.tot && r.y === best.y);
    const more = ranked.filter((r) => r.tot > 0 && !ties.includes(r)).slice(0, 3);
    const label = ties.length > 1 ? `Égalité entre ${ties.length} créneaux` : (best.tot === n && !best.mb ? 'Tout le monde est dispo' : 'Meilleur créneau');
    let body = scoreLine(best, n) + whoList(best.i, people);
    body += `<div class="v-actions"><button type="button" class="btn chalk" data-act="final" data-i="${best.i}">Choisir ce créneau</button></div>`;
    if (ties.length > 1) {
      body += `<div class="ties">Aussi à égalité&nbsp;: ${ties.slice(1, 6).map((r) =>
        `<button type="button" class="tie" data-act="final" data-i="${r.i}" title="Choisir ce créneau">${esc(slotShort(slots[r.i]))}</button>`).join('')}</div>`;
    }
    if (more.length) body += `<p class="v-more">Ensuite&nbsp;: ${more.map((r) => `${esc(slotShort(slots[r.i]))} (${r.tot}/${n})`).join(' · ')}</p>`;
    return wrap(label, esc(slotLong(slots[best.i])), body);
  }

  function answerCountText() {
    let y = 0, m = 0;
    for (const v of ui.vals) { if (v === 1) y++; else if (v === 2) m++; }
    return `${y} dispo · ${m} si besoin`;
  }
  function nameHint(name) {
    const k = norm(name);
    if (!k) return '';
    if (ui.editing && norm(ui.editing) === k) return `Vous modifiez la réponse de ${ui.editing}.`;
    const ex = poll.st.p.find((p) => norm(p[0]) === k);
    if (ex) return `${ex[0]} a déjà répondu : cette réponse remplacera la sienne.`;
    if (ui.editing) return `La réponse de ${ui.editing} sera renommée « ${name.trim()} ».`;
    return '';
  }
  function slotAria(sl, v) { return `${fmt(fLong, sl.d)}, ${MOMENTS[sl.t].toLowerCase()} : ${STATE_LABEL[v]}`; }

  function openAnswer(name) {
    const slots = buildSlots(poll.st);
    const created = ui.created;
    ui = freshUi();
    ui.created = created;
    ui.open = true;
    const p = name ? poll.st.p.find((x) => norm(x[0]) === norm(name)) : null;
    if (p) {
      ui.editing = p[0]; ui.name = p[0];
      ui.vals = slots.map((_, i) => +(p[1][i] || 0));
    } else {
      ui.name = name || '';
      ui.vals = slots.map(() => 0);
    }
  }

  function answerHTML(c) {
    const { slots, people } = c;
    if (!ui.open) {
      const me = getMe();
      const meP = me && people.find((p) => norm(p[0]) === norm(me));
      return `<section class="cta" id="answer">
        ${ui.savedName ? `<p class="okmsg" role="status">C’est enregistré, merci ${esc(ui.savedName)}&nbsp;! Tout le monde le voit déjà sur le lien.</p>` : ''}
        ${meP
          ? `<button type="button" class="btn primary big" data-act="edit" data-name="${esc(meP[0])}">Modifier mes dispos (${esc(meP[0])})</button>
             <button type="button" class="btn" data-act="open-answer">Ajouter une autre personne</button>`
          : `<button type="button" class="btn primary big" data-act="open-answer">Ajouter mes dispos</button>`}
        ${people.length ? '<p class="hint">Déjà répondu&nbsp;? Touchez votre prénom dans le tableau pour modifier.</p>' : ''}
      </section>`;
    }
    let rows = '', lastDay = null, lastMonth = null;
    slots.forEach((sl, i) => {
      if (sl.d !== lastDay) {
        if (lastDay !== null) rows += '</div></div>';
        if (monthKey(sl.d) !== lastMonth) { rows += `<p class="amonth">${fmt(fMonth, sl.d)}</p>`; lastMonth = monthKey(sl.d); }
        rows += `<div class="arow"><div class="adate"><span class="wd">${fmt(fWd, sl.d)}</span> ${fmt(fDM, sl.d)}</div><div class="aslots">`;
        lastDay = sl.d;
      }
      const v = ui.vals[i] || 0;
      rows += `<button type="button" class="sbtn s${v}" data-act="slot" data-i="${i}" aria-label="${esc(slotAria(sl, v))}"><span class="mk" aria-hidden="true"></span>${MOMENTS[sl.t]}</button>`;
    });
    if (lastDay !== null) rows += '</div></div>';
    const del = !ui.editing ? '' : ui.delAsk
      ? `<div class="confirm"><span>Supprimer la réponse de ${esc(ui.editing)}&nbsp;?</span><button type="button" class="btn danger" data-act="del-confirm">Supprimer</button><button type="button" class="btn" data-act="del-cancel">Annuler</button></div>`
      : `<button type="button" class="linkbtn danger" data-act="del-ask">Supprimer la réponse de ${esc(ui.editing)}</button>`;
    return `<section class="card answer" id="answer" aria-labelledby="a-h">
      <div class="ahead"><h2 id="a-h">${ui.editing ? 'Modifier une réponse' : 'Mes dispos'}</h2><button type="button" class="linkbtn" data-act="close-answer">Fermer</button></div>
      <div class="field"><label for="ans-name">Prénom</label><input type="text" id="ans-name" maxlength="40" autocomplete="given-name" placeholder="Camille" value="${esc(ui.name)}"><p class="hint" id="ans-hint" aria-live="polite">${esc(nameHint(ui.name))}</p></div>
      <p class="legend">Touchez un créneau&nbsp;: une fois <span class="pill s1">✓ dispo</span> deux fois <span class="pill s2">~ si besoin</span> trois fois pour effacer.</p>
      <div class="bulk"><button type="button" class="mini" data-act="bulk" data-v="1">Tout cocher</button><button type="button" class="mini" data-act="bulk" data-v="0">Tout effacer</button></div>
      <div class="adays">${rows}</div>
      ${del}
      <div class="afoot"><span class="count" id="ans-count">${answerCountText()}</span><button type="button" class="btn primary" data-act="save">Enregistrer mes dispos</button></div>
    </section>`;
  }

  function shareHTML() {
    const link = pollLink();
    const wa = 'https://wa.me/?text=' + encodeURIComponent(`${poll.st.t || 'Repas'} : ajoute tes dispos ici ${link}`);
    return `<section class="card share ${ui.created ? 'flash' : ''}" id="share" aria-labelledby="s-h">
      <h2 id="s-h">${ui.created ? 'Votre sondage est prêt' : 'Inviter le groupe'}</h2>
      <p class="muted">${ui.created
        ? 'Envoyez ce lien au groupe, une seule fois. Chacun y ajoute ses dispos et tout le monde voit les réponses en direct.'
        : 'Un seul lien pour tout le monde. Les réponses s’y ajoutent au fur et à mesure.'}</p>
      <div class="link-row"><input type="text" id="share-link" readonly value="${esc(link)}" aria-label="Lien du sondage"><button type="button" class="btn primary" data-act="copy">Copier le lien</button></div>
      <div class="share-actions"><a class="btn" href="${esc(wa)}" target="_blank" rel="noopener">Envoyer sur WhatsApp</a></div>
    </section>`;
  }

  function tableHTML(c) {
    const { slots, people, stats } = c;
    if (!people.length) return '';
    const n = people.length;
    const best = rank(stats)[0];
    const f = finalIndex(slots);
    const isBest = (r) => f < 0 && best.tot > 0 && r.tot === best.tot && r.y === best.y;
    const head = `<tr><th class="c-slot" scope="col">Créneau</th><th class="c-score" scope="col">Dispo</th>${people.map((p) =>
      `<th scope="col"><button type="button" class="who-btn" data-act="edit" data-name="${esc(p[0])}" title="Modifier la réponse de ${esc(p[0])}">${esc(p[0])}</button></th>`).join('')}</tr>`;
    const body = slots.map((sl, i) => {
      const r = stats[i];
      const cls = i === f ? 'final' : isBest(r) ? 'best' : '';
      const tag = i === f ? '<span class="tag">choisi</span>' : isBest(r) ? '<span class="tag">en tête</span>' : '';
      const pct = Math.round((r.tot / n) * 100);
      const cells = people.map((p) => {
        const ch = p[1][i];
        return ch === '1' ? '<td class="v1" title="Dispo">✓</td>' : ch === '2' ? '<td class="v2" title="Si besoin">~</td>' : '<td class="v0" title="Pas dispo">·</td>';
      }).join('');
      return `<tr class="${cls}"><th class="c-slot" scope="row"><span class="d">${fmt(fShort, sl.d)}${tag}</span><span class="t">${MOMENTS[sl.t]}</span></th><td class="c-score"><span class="num">${r.tot}</span><span class="of">/${n}</span><span class="bar"><i style="width:${pct}%"></i></span></td>${cells}</tr>`;
    }).join('');
    return `<section class="results" aria-labelledby="r-h">
      <h2 id="r-h">Toutes les réponses</h2>
      <p class="hint">Touchez un prénom pour modifier sa réponse. ${poll.example ? '' : '<span class="live">Mis à jour automatiquement</span>'}</p>
      <div class="table-scroll"><table class="grid"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    </section>`;
  }

  /* ---------- Actions ---------- */
  // Applique une modification : sur le serveur, ou en mémoire pour l'exemple.
  async function mutate(kind, payload) {
    if (poll.example) { poll.st = applyLocal(poll.st, kind, payload); return; }
    const id = poll.st.i;
    const path = '/polls/' + id + (kind === 'final' ? '/final' : '/answers');
    const st = await api(kind === 'delete' ? 'DELETE' : 'PUT', path, payload);
    if (poll && poll.st.i === id) { poll.st = st; remember(st); }
  }
  function applyLocal(st, kind, pl) {
    const out = Object.assign({}, st, { p: st.p.slice() });
    if (kind === 'final') { out.f = pl.i; return out; }
    if (kind === 'delete') { out.p = out.p.filter((p) => norm(p[0]) !== norm(pl.name)); return out; }
    const key = norm(pl.name);
    if (pl.prev && norm(pl.prev) !== key) out.p = out.p.filter((p) => norm(p[0]) !== norm(pl.prev));
    const entry = [pl.name, pl.ans, Date.now()];
    const idx = out.p.findIndex((p) => norm(p[0]) === key);
    if (idx >= 0) out.p[idx] = entry; else out.p.push(entry);
    return out;
  }

  async function runAction(btn, label, fn) {
    if (busy) return;
    busy = true;
    const old = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = label; }
    try {
      await fn();
    } catch (err) {
      showToast(err.message, true);
      if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = old; }
    } finally {
      busy = false;
    }
  }

  function saveAnswer(btn) {
    const name = ui.name.trim().replace(/\s+/g, ' ');
    const hint = $('#ans-hint');
    if (!name) {
      hint.textContent = 'Indiquez votre prénom pour enregistrer.';
      hint.classList.add('error');
      $('#ans-name').focus();
      return;
    }
    return runAction(btn, 'Enregistrement…', async () => {
      await mutate('save', { name, ans: ui.vals.join(''), prev: ui.editing });
      if (!poll.example) remember(poll.st, name);
      const created = ui.created;
      ui = freshUi();
      ui.created = created;
      ui.savedName = name;
      renderPoll();
      scrollToId('verdict-slot');
    });
  }

  function deleteAnswer(btn) {
    const name = ui.editing;
    return runAction(btn, 'Suppression…', async () => {
      await mutate('delete', { name });
      ui = freshUi();
      renderPoll();
      showToast(`Réponse de ${name} supprimée.`);
    });
  }

  function setFinal(btn, i) {
    return runAction(btn, i >= 0 ? 'Enregistrement…' : 'Annulation…', async () => {
      await mutate('final', { i });
      renderLive();
      if (i >= 0) {
        showToast('Créneau choisi : tout le monde le voit sur le lien.');
        scrollToId('verdict-slot');
      }
    });
  }

  async function copyLink(btn) {
    const input = $('#share-link');
    try {
      await navigator.clipboard.writeText(input.value);
      btn.textContent = 'Lien copié';
    } catch (e) {
      input.focus();
      input.select();
      btn.textContent = 'Sélectionné : copiez-le';
    }
    setTimeout(() => { if (btn.isConnected) btn.textContent = 'Copier le lien'; }, 2500);
  }

  function cycleSlot(el) {
    const i = +el.dataset.i;
    const v = ((ui.vals[i] || 0) + 1) % 3;
    ui.vals[i] = v;
    el.className = 'sbtn s' + v;
    el.setAttribute('aria-label', slotAria(poll.slots[i], v));
    $('#ans-count').textContent = answerCountText();
  }
  function bulk(v) {
    ui.vals = ui.vals.map(() => v);
    app.querySelectorAll('.sbtn').forEach((el) => {
      el.className = 'sbtn s' + v;
      el.setAttribute('aria-label', slotAria(poll.slots[+el.dataset.i], v));
    });
    $('#ans-count').textContent = answerCountText();
  }

  function scrollToId(id) {
    const el = document.getElementById(id);
    const target = el && (el.classList.contains('slot') ? el.firstElementChild : el);
    if (target) target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
  }

  /* ---------- Actualisation automatique ---------- */
  const signature = (st) => JSON.stringify([st.p, st.f]);
  async function refresh() {
    if (view !== 'poll' || !poll || poll.example || busy || document.visibilityState !== 'visible') return;
    const id = poll.st.i;
    try {
      const st = await api('GET', '/polls/' + id);
      if (busy || !poll || poll.st.i !== id) return;
      if (signature(st) !== signature(poll.st)) {
        poll.st = st;
        remember(st);
        renderLive();
      }
    } catch (e) { /* on réessaiera au prochain passage */ }
  }
  function startRefresh() { stopRefresh(); refreshTimer = setInterval(refresh, REFRESH_MS); }
  function stopRefresh() { if (refreshTimer) clearInterval(refreshTimer); refreshTimer = null; }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });

  /* ---------- Exemple ---------- */
  function exampleState() {
    const s = todayDay + 6, e = s + 20;
    const st = { i: 'exemple', t: 'Raclette de décembre', n: 'Chez Léa · chacun apporte un fromage', s: ymd(s, ''), e: ymd(e, ''), m: [0, 0, 0, 0, 16, 20, 4], x: [], p: [], f: -1 };
    const slots = buildSlots(st);
    const names = ['Léa', 'Karim', 'Sophie', 'Hugo', 'Inès'];
    let seed = 11;
    const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
    const grid = names.map(() => slots.map(() => { const r = rnd(); return r < 0.45 ? '1' : r < 0.6 ? '2' : '0'; }));
    const star = Math.min(slots.length - 1, Math.floor(slots.length * 0.6));
    slots.forEach((_, i) => {
      if (i === star) { names.forEach((_, k) => { grid[k][i] = k === 3 ? '2' : '1'; }); return; }
      if (names.every((_, k) => grid[k][i] !== '0')) grid[i % names.length][i] = '0';
    });
    st.p = names.map((nm, k) => [nm, grid[k].join(''), k]);
    return st;
  }

  /* ---------- Événements ---------- */
  function focusSelector(el) {
    let sel = `[data-act="${el.dataset.act}"]`;
    for (const k of ['t', 'w', 'd', 'p', 'i']) if (el.dataset[k] != null) sel += `[data-${k}="${el.dataset[k]}"]`;
    return sel;
  }

  app.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el || !app.contains(el)) return;
    const act = el.dataset.act;
    const hadFocus = document.activeElement === el;
    const refocus = () => { if (hadFocus) { const n = app.querySelector(focusSelector(el)); if (n) n.focus({ preventScroll: true }); } };
    switch (act) {
      case 'moment': toggleMoment(+el.dataset.t); renderCreateDynamic(); refocus(); break;
      case 'day': toggleDay(+el.dataset.w); renderCreateDynamic(); refocus(); break;
      case 'preset': preset(el.dataset.p); renderCreateDynamic(); break;
      case 'cell': draft.m[+el.dataset.w] ^= 1 << +el.dataset.t; renderCreateDynamic(); refocus(); break;
      case 'excl': { const d = +el.dataset.d; if (draft.x.has(d)) draft.x.delete(d); else draft.x.add(d); renderCreateDynamic(); refocus(); break; }
      case 'create': createPoll(el); break;
      case 'retry': lastRoute = el.dataset.id; loadPoll(el.dataset.id); break;
      case 'open-answer': {
        openAnswer(null); renderPoll(); scrollToId('answer');
        const n = $('#ans-name'); if (n) n.focus({ preventScroll: true });
        break;
      }
      case 'edit': openAnswer(el.dataset.name); renderPoll(); scrollToId('answer'); break;
      case 'close-answer': { const created = ui.created; ui = freshUi(); ui.created = created; renderPoll(); scrollToId('answer'); break; }
      case 'slot': cycleSlot(el); break;
      case 'bulk': bulk(+el.dataset.v); break;
      case 'save': saveAnswer(el); break;
      case 'del-ask': {
        ui.delAsk = true; renderPoll();
        const n = $('[data-act="del-confirm"]'); if (n) n.focus({ preventScroll: true });
        break;
      }
      case 'del-cancel': ui.delAsk = false; renderPoll(); break;
      case 'del-confirm': deleteAnswer(el); break;
      case 'copy': copyLink(el); break;
      case 'final': setFinal(el, +el.dataset.i); break;
      case 'unfinal': setFinal(el, -1); break;
    }
  });

  function onDateChange(t) {
    const v = parseYmd(t.value);
    if (t.id === 'c-start') {
      draft.s = v;
      if (Number.isFinite(v) && Number.isFinite(draft.e) && draft.e < v) { draft.e = v + 27; $('#c-end').value = ymd(draft.e); }
    } else {
      draft.e = v;
    }
    renderCreateDynamic();
  }
  app.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.id === 'c-title') draft.t = t.value;
    else if (t.id === 'c-note') draft.n = t.value;
    else if (t.id === 'c-start' || t.id === 'c-end') onDateChange(t);
    else if (t.id === 'ans-name') {
      ui.name = t.value;
      const h = $('#ans-hint');
      h.classList.remove('error');
      h.textContent = nameHint(t.value);
    }
  });
  app.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.id === 'c-start' || t.id === 'c-end') onDateChange(t);
  });
  app.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && ev.target.id === 'ans-name') {
      ev.preventDefault();
      saveAnswer($('[data-act="save"]'));
    }
  });

  /* ---------- Navigation ---------- */
  function route() {
    const h = location.hash.replace(/^#/, '');
    if (h === lastRoute && view) return;
    lastRoute = h;
    stopRefresh();
    if (!h || h === 'nouveau') { showCreate(); window.scrollTo(0, 0); return; }
    if (h === 'exemple') {
      poll = { st: exampleState(), example: true };
      ui = freshUi();
      view = 'poll';
      renderPoll();
      window.scrollTo(0, 0);
      return;
    }
    if (ID_RE.test(h)) { loadPoll(h).then(() => window.scrollTo(0, 0)); return; }
    showCreate('Ce lien ne correspond à aucun sondage. Vérifiez qu’il a été copié en entier.');
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
