<!doctype html>
<!-- Image d'aperçu des liens partagés (public/apercu.png, 1200 × 630). Régénérer : sh scripts/images/fabriquer.sh
     Tout l'essentiel tient dans le carré central (630 px), que certaines messageries gardent seul. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Bricolage Grotesque'; font-weight: 500 800; src: url('../../public/fonts/bricolage-grotesque-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Instrument Sans'; font-weight: 400 700; src: url('../../public/fonts/instrument-sans-latin.woff2') format('woff2'); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #F6F6F3; color: #17171A; font-family: 'Instrument Sans', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  }
  .brand { display: flex; align-items: center; gap: 26px; }
  .brand svg { width: 116px; height: 116px; }
  .brand span { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 142px; letter-spacing: -0.04em; line-height: 1; margin-top: -14px; }
  .tag { margin-top: 26px; font-size: 40px; font-weight: 600; color: #64646E; letter-spacing: -0.01em; }
  .cal { margin-top: 58px; display: flex; gap: 14px; }
  .pill {
    width: 100px; height: 100px; border-radius: 22px; border: 3px solid transparent;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums;
  }
  .pill small { font-size: 21px; font-weight: 600; opacity: 0.85; }
  .pill b { font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 700; }
  .h0 { background: #FFFFFF; border-color: #E2E2DB; color: #64646E; }
  .h1 { background: #D5EEDD; color: #14532D; }
  .h2 { background: #A4D9B6; color: #14532D; }
  .h3 { background: #57B37C; color: #06200F; }
  .final { background: #DC3B1F; color: #FFFFFF; box-shadow: 0 0 0 5px #F6F6F3, 0 0 0 10px #DC3B1F; }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#DC3B1F"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="#fff" stroke-width="3"/><circle cx="16" cy="16" r="2.6" fill="#fff"/></svg>
    <span>dispos</span>
  </div>
  <p class="tag">Trouvez la date où tout le monde peut venir.</p>
  <div class="cal">
    <div class="pill h1"><small>lun.</small><b>12</b></div>
    <div class="pill h0"><small>mar.</small><b>13</b></div>
    <div class="pill h2"><small>mer.</small><b>14</b></div>
    <div class="pill h3"><small>jeu.</small><b>15</b></div>
    <div class="pill final"><small>ven.</small><b>16</b></div>
    <div class="pill h2"><small>sam.</small><b>17</b></div>
    <div class="pill h1"><small>dim.</small><b>18</b></div>
  </div>
</body>
</html>
